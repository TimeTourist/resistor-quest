<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Färgkoden dev</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6b6a64; --line:#dedad0; --strong:#1d1d1b;
  --accent:#2f6f4f; --accent-ink:#fff; --head:#ece8de; --warn:#fff3cd; --warn-ink:#5c4400; --hover:#f1efe8; --drop:#2f6f4f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171715; --card:#21211e; --ink:#ecebe6; --muted:#a3a198; --line:#3a3933; --strong:#ecebe6;
    --accent:#6fbf8f; --accent-ink:#10140f; --head:#2a2a26; --warn:#3d3415; --warn-ink:#f3e2a4; --hover:#2a2a26; --drop:#6fbf8f;
  }
}
:root[data-theme="dark"]{
  --bg:#171715; --card:#21211e; --ink:#ecebe6; --muted:#a3a198; --line:#3a3933; --strong:#ecebe6;
  --accent:#6fbf8f; --accent-ink:#10140f; --head:#2a2a26; --warn:#3d3415; --warn-ink:#f3e2a4; --hover:#2a2a26; --drop:#6fbf8f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px;max-width:1500px;margin:0 auto}
h1{font-size:18px;margin:0 auto 0 0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:8px 12px;margin-bottom:12px}
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--strong);margin-bottom:0}
[role=tab]{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--head)}
[role=tab][aria-selected=true]{background:var(--strong);color:var(--bg);border-color:var(--strong)}
[role=tab] .n{opacity:.7;font-size:12px;margin-left:4px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-top:none}
table{border-collapse:collapse;width:100%;min-width:1150px}
th,td{text-align:left;vertical-align:top;padding:4px 6px;border-top:1px solid var(--line)}
thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card);position:sticky;top:0}
td.grade{font-weight:700;white-space:nowrap;width:96px}
tr.first td{border-top:3px solid var(--strong)}
tr.first td.grade{color:var(--ink)}
tr:not(.first) td.grade{color:transparent}
tr.empty td{color:var(--muted);font-style:italic}
tr.idea td.grade{color:var(--muted)}
tr.idea.first td{border-top-style:dashed}
tr[data-id]:hover{background:var(--hover)}
tr.dragging{opacity:.4}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--drop)}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--drop)}
tr.changed td.handle{box-shadow:inset 3px 0 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);user-select:none;width:22px;text-align:center;padding-top:8px}
textarea,select{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px;width:100%;resize:vertical;field-sizing:content;min-height:2.2em}
textarea:hover,select:hover{border-color:var(--line)}
textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card)}
textarea[data-f=name]{font-weight:600}
td.acts{white-space:nowrap;width:70px}
td.acts a,td.acts button{padding:2px 6px;font-size:12px}
.foot{display:flex;gap:8px;margin-top:10px}
#out{margin-top:16px}
#out[hidden]{display:none}
#prompt{width:100%;min-height:260px;font:12px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink)}
.outbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.outbar span{color:var(--muted)}
/* Spelet i en panel till höger, i mobilbredd. På smala skärmar täcker den hela sidan. */
#viewer{position:fixed;top:0;right:0;bottom:0;width:min(410px,100vw);z-index:20;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18)}
#viewer[hidden]{display:none}
.vbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.vtitle{margin-right:auto;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer iframe{flex:1;border:0;width:100%;background:var(--bg)}
body.viewing main,body.viewing header{margin-right:410px}
@media (max-width:900px){body.viewing main,body.viewing header{margin-right:auto}}
</style>
</head>
<body>
<header>
  <h1>Färgkoden · dev</h1>
  <button id="reset" title="Släng alla ändringar och börja om från spelets katalog">Återställ</button>
  <button id="gen" class="primary">Generera prompt</button>
</header>
<main>
  <div id="notice" class="notice" hidden>Spelets katalog har uppdaterats sedan dina ändringar. Prompten jämför fortfarande mot den gamla versionen. Generera den, eller tryck Återställ för att börja från den nya.</div>
  <div role="tablist" id="tabs"></div>
  <div class="wrap">
    <table>
      <thead><tr><th>Grad</th><th></th><th>Kort namn</th><th>Fråga</th><th>Svarstyp</th><th>Rätt-animering</th><th>Fel-animering</th><th>Status</th><th>Kommentar</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="foot"><button id="add">+ Ny frågetyp</button></div>
  <aside id="viewer" hidden aria-label="Spelet">
    <div class="vbar"><span class="vtitle"></span><button class="vreload" title="Ladda om">↻</button><button class="vclose">Stäng</button></div>
    <iframe title="Färgkoden"></iframe>
  </aside>
  <section id="out" hidden>
    <div class="outbar"><button id="copy">Kopiera</button><span id="copied"></span></div>
    <textarea id="prompt" readonly></textarea>
  </section>
</main>
<script>
// Översikt över spelets frågetyper. Katalogen nedan beskriver index.html och uppdateras när spelet ändras.
// Dina ändringar sparas i webbläsaren. "Generera prompt" skriver ut det som skiljer sig från katalogen.
const TABS = [
  {id:'body', name:'Motståndet'}, {id:'ohm', name:'Resistansen'}, {id:'tol', name:'Toleransen'},
  {id:'tc', name:'Temperaturen'}, {id:'e', name:'E-serierna'}, {id:'ultra', name:'Eldprovet'}
];
const GRADE_NAME = ['Nykomling','Lärling','Gesäll','Mästare','Stormästare','Idéer'];
const EXAM_GROUPS = ['Eldprovet', null, null, null, null, 'Idéer'];
const IDEA = 5;
const groupsOf = tab => tab === 'ultra' ? [0, IDEA] : [0, 1, 2, 3, 4, IDEA];
const groupName = (tab, g) => (tab === 'ultra' ? EXAM_GROUPS : GRADE_NAME)[g];
const FIELDS = [['name','Namn'], ['q','Fråga'], ['kind','Svarstyp'], ['right','Rätt-animering'], ['wrong','Felanimering'], ['status','Status'], ['comment','Kommentar']];
const STATUS = ['klar', 'behöver animering', 'ändra', 'idé'];

// Standard: gnista, lysdiod, konfetti och priing, sedan kommer nästa fråga själv
const STD = 'Standard';
const POP = 'Ballongen poppar, de tre kvar blir gröna, nästa själv';
const VSB = 'Vilken ska bort?';
const r = (id, g, name, q, kind, right, wrong, status = 'klar') => ({id, g, name, q, kind, right, wrong, status, comment: ''});
const CATALOG = {
  body: [
    r('body-rakna', 0, 'Räkna banden', 'Hur många färgband har motståndet? Svaret och valen är alltid 4, 5 eller 6.', 'Flerval', STD,
      'Banden numreras ett i taget och rätt antal landar.'),
    r('body-antal', 1, 'Fel antal band', 'Ett av dem är inget motstånd. Räkna banden! Ett av fyra motstånd har 2, 7 eller 8 band.', VSB, POP,
      'Det udda räknar sina band i rött och poppar, de andra räknar i grönt och får ✓.'),
    r('body-farg', 2, 'Färg som inte finns', 'Ett av fyra motstånd har en färg som inte finns (turkos eller limegrön).', VSB, POP,
      'Ringen runt den falska färgen blir röd, de tolv riktiga färgerna läggs ut och den falska hamnar bredvid med ✗. Sedan poppar kortet.'),
    r('body-hall', 3, 'Läsriktning', 'Från vilket håll läser man? Motståndet kan sitta vänt.', 'Vänster/höger', STD,
      'Banden räknas 1, 2, 3 … från rätt ände. Ledtråden skrivs ut: brett band, mellanrum eller samlade band.'),
    r('body-forsta', 4, 'Peka på första bandet', 'Peka på första bandet. Kan sitta vänt, inga guld- eller silverband.', 'Peka på band', STD,
      'Röd ring på ditt val, grön ring och 1 på rätt band, ledtråden och en svepande pil.')
  ],
  ohm: [
    r('ohm-klammer', 0, 'Fel klammer', 'Klammern visar vilka band som ger ohm-värdet. Varje motstånds värde står vid klammern (t.ex. 56 kΩ). På ett av fyra motstånd tar klammern med för många eller för få band.', VSB, POP,
      'Den felaktiga klammern blir röd, rätt klammer glider in, kortet poppar.'),
    r('ohm-farg-siffra', 1, 'Färg → siffra', 'Vilken siffra är det markerade bandet?', 'Flerval', STD,
      'Färgskalan visas och markeringen går fram till rätt färg.'),
    r('ohm-siffra-farg', 1, 'Siffra → färg', 'Vilken färg betyder 7?', 'Färgval', STD,
      'Färgskalan visas och markeringen går fram till rätt färg.'),
    r('ohm-ordna', 1, 'Ordna värdena', 'Varje siffra har en färg. Klicka på färgerna i nummerordning. Tio tomma lådor med 0–9 ovanför, färgerna blandade under. Utan fel är frågan rätt. Med fel flyger alla tillbaka och man får ett sista försök (samma ordning på färgerna, ingen ledtråd förrän man gör fel). Fel i sista försöket gör frågan fel.', 'Alla färger som knappar',
      'Färgen flyger upp och blir grön först när den landar, med en ton som stiger för varje färg. Var femte gång låtsas den flyga mot fel låda och vänder.',
      'Fel färg flyger till sin egen låda, blir röd, skakar och flyger tillbaka. Den rätta färgen skakar med en grön ring. Vid nytt försök: Nästan! Du får ett sista försök – utan hjälp.'),
    r('ohm-peka-siffra', 1, 'Peka på siffra', 'Peka på bandet som ger tvåan i resistansen. Siffran är markerad i klammerns värde (Resistans = 2̲7 Ω) och värdena står under banden. Samma siffra två gånger: "första tvåan". 4–6 band, multiplikator minst ×1.', 'Peka på band', STD,
      'Ringar vandrar över banden från början fram till rätt band.'),
    r('ohm-peka', 2, 'Peka på multiplikatorn', 'Peka på multiplikatorn. Värdena står under banden och klammern säger t.ex. Resistans = 23 kΩ. 4–6 band, guld och silver som multiplikator.', 'Peka på band', STD,
      'Ringar vandrar över banden från början fram till multiplikatorn.'),
    r('ohm-peka-siffra-utan', 2, 'Peka på siffra utan stöd', 'Som Peka på siffra på Lärling, men utan värdena under banden: man måste kunna färgen.', 'Peka på band', STD,
      'Ringar vandrar över banden från början fram till rätt band.'),
    r('ohm-ordna-mult', 2, 'Ordna multiplikatorerna', 'Klicka på multiplikatorerna från minst till störst: ×0,01 till ×1M. Precis som Ordna värdena, med sista försök.', 'Alla färger som knappar',
      'Som Ordna värdena.',
      'Som Ordna värdena. Raden: Silver ×0,01, guld ×0,1 …'),
    r('ohm-mastare', 3, 'Siffror och nollor', 'Hur stor är resistansen? 4–6 band, bara klammern som stöd.', 'Flerval', STD,
      'Banden får sina värden (multiplikatorn ovanför), sedan byggs talet: 47 · 00 = 4 700 Ω = 4,7 kΩ.'),
    r('ohm-bygg', 3, 'Bygg värdet', 'Bygg motståndet för ett värde med färgpaletten. Fem band, sitter aldrig vänt.', 'Palett', STD,
      'Beräkningsraden.'),
    r('ohm-knappa', 4, 'Knappa in värdet', 'Fem band, kan sitta vänt. En ruta under varje band (även toleransen). Markeringen börjar längst till vänster; tryck på ett band och skriv dess siffra, eller välj multiplikatorn under fliken ×. Efter varje inmatning hoppar markeringen till närmaste lediga åt höger, annars vänster. Rättas när siffrorna plus multiplikatorn är ifyllda. Ingen ledtråd om läsriktningen.', 'Knappsats under banden', STD,
      'Felaktiga rutor blir röda och visar rätt värde, banden ringas in, multiplikatorn står ovanför och beräkningsraden byggs upp.')
  ],
  tol: [
    r('tol-ring', 0, 'Fel band markerat', 'Toleransbandet är markerat på fyra motstånd. På ett sitter markeringen fel.', VSB, POP,
      'Röd ring på fel band och grön ring där toleransen sitter, och antalet band i hörnet (4 band). Raden med regeln.', 'behöver animering'),
    r('tol-gs-farg', 1, 'Guld/silver → tolerans', 'Vilken tolerans har det markerade bandet (guld eller silver)?', 'Flerval', STD,
      'Bara raden: Guld är ±5 % och silver ±10 %.', 'behöver animering'),
    r('tol-gs-tol', 1, 'Tolerans → guld/silver', 'Vilken färg betyder ±5 %?', 'Färgval', STD,
      'Bara raden: Guld är ±5 % och silver ±10 %.', 'behöver animering'),
    r('tol-vanligast', 1, 'Vanligast', 'De flesta motstånd med fyra (fem) band har samma tolerans. Vilken? Guld ±5 % på fyra band, brun ±1 % på fem.', 'Färgval', STD,
      'Bara raden: fyra band är oftast kolfilm med guld, fem band metallfilm med brun.', 'behöver animering'),
    r('tol-alla-farg', 2, 'Färg → tolerans', 'Vilken tolerans har det markerade bandet? Alla toleransfärger.', 'Flerval', STD,
      'Toleransskalan (utan animering) och raden.', 'behöver animering'),
    r('tol-alla-tol', 2, 'Tolerans → färg', 'Vilken färg betyder ±2 %?', 'Färgval', STD,
      'Toleransskalan (utan animering) och raden.', 'behöver animering'),
    r('tol-ordna', 2, 'Ordna värdena', 'Klicka på toleransfärgerna från störst till minst tolerans: ±10 % till ±0,1 %, som i skoltabellerna. Precis som Ordna värdena i Resistansen, med sista försök.', 'Alla färger som knappar',
      'Som Ordna värdena.',
      'Som Ordna värdena. Raden: Silver ±10 %, guld ±5 % …'),
    r('tol-intervall', 3, 'Intervall', 'Mellan vilka värden får resistansen ligga? Fyra band.', 'Flerval (text)', STD,
      'Bara raden med gränserna.', 'behöver animering'),
    r('tol-knappa', 4, 'Knappa in hela', 'Värde och tolerans, 4 eller 5 band, kan sitta vänt.', 'Knappsats', STD,
      'Fälten markeras och raden.', 'behöver animering'),
    r('tol-bygg', 4, 'Bygg hela', 'Bygg motståndet med värde och tolerans.', 'Palett', STD,
      'Banden markeras och raden.', 'behöver animering')
  ],
  tc: [
    r('tc-ring', 0, 'Fel band markerat', 'Temperaturbandet är markerat på fyra sexbandare. På ett sitter markeringen fel.', VSB, POP,
      'Röd ring på fel band och grön ring på sjätte bandet. Raden med regeln.', 'behöver animering'),
    r('tc-vilket', 1, 'Vilket har temperaturband?', 'Fyra motstånd, ett har sex band.', 'Flerval (motstånd)', STD,
      'Bara raden: bara sexbandare har temperaturband.', 'behöver animering'),
    r('tc-vanligast', 1, 'Vanligast', 'De flesta motstånd med temperaturband har samma värde. Vilket? Brun 100 ppm/K, mot svart 250, röd 50 och gul 25.', 'Färgval', STD,
      'Bara raden: brun 100 ppm/K är vanligast, lägre värden är dyrare precisionsmotstånd.', 'behöver animering'),
    r('tc-farg', 2, 'Färg → ppm/K', 'Vilken temperaturkoefficient har det markerade bandet?', 'Flerval', STD,
      'Ppm-skalan (utan animering) och raden.', 'behöver animering'),
    r('tc-ppm', 2, 'ppm/K → färg', 'Vilken färg betyder 50 ppm/K?', 'Färgval', STD,
      'Ppm-skalan (utan animering) och raden.', 'behöver animering'),
    r('tc-stabil', 3, 'Stabilast', 'Vilket motstånd ändrar sitt värde minst när det blir varmt?', 'Flerval (motstånd)', STD,
      'Bara raden: lägst ppm/K ändras minst.', 'behöver animering'),
    r('tc-knappa', 4, 'Knappa in hela', 'Sex band: värde, tolerans och ppm/K. Kan sitta vänt.', 'Knappsats', STD,
      'Fälten markeras och raden.', 'behöver animering'),
    r('tc-bygg', 4, 'Bygg hela', 'Bygg en sexbandare.', 'Palett', STD,
      'Banden markeras och raden.', 'behöver animering')
  ],
  e: [
    r('e-vad', 0, 'Vad är E6?', 'Standardvärden som motstånd säljs i. Bara här står raden: E6 är ovanlig, men bra för att lära ut principen med serier.', 'Flerval (text)', STD,
      'Raka linjalen: E6-värdena faller ner. Vid fel tänds 4,7 Ω, 47 Ω och 4,7 kΩ.'),
    r('e-placera-log', 0, 'Placera på skalan', 'Logaritmisk skala, sex platser på lika avstånd. 10–68 Ω, 1,0–6,8 Ω eller 1–6,8 kΩ.', 'Ordna (värden)', STD,
      'Bågar ×1,5 mellan grannarna, sedan → 100, nästa varv.'),
    r('e-placera-lador', 0, 'Placera i lådorna', 'Rak skala från 0, lådorna på värdenas riktiga platser.', 'Ordna (värden)', STD,
      'Toleransstaplarna ±20 % växer ut och når fram till varandra.'),
    r('e-glesare', 0, 'Varför glesare?', 'Varför ligger värdena glesare högre upp?', 'Flerval (text)', STD,
      'Raka linjalen: värdena faller, staplarna ±20 % växer, allt täcks. Tabell med ±2 Ω till ±13,6 Ω.'),
    r('e-tol-staplar', 1, 'Vilken tolerans är serien gjord för?', 'E6 i hälften av frågorna: ±40, ±20 eller ±10 %. Rak linjal utan siffror, med den rätta toleransens staplar kant i kant.', 'Flerval', STD,
      'Tre rader på raka linjalen: krock i rött, kant i kant och glapp i gult. Den valda raden har en ram.'),
    r('e-band-ring', 1, 'Vilken serie hör till motståndet?', 'Toleransbandet är inringat, färgen står under.', 'Flerval', STD,
      'Trappan med ett litet motstånd per serie, och den rätta lyser.'),
    r('e-racker', 1, 'Vilken serie räcker?', 'Din krets klarar att motståndet är fel med upp till ±10 %. Vilken serie köper du? Ta den billigaste som räcker. Ett motstånd med kravets toleransband inringat.', 'Flerval', STD,
      'Trappan med motstånd och kravlinjen: för grov i rött, räcker i grönt, onödigt fin i grått.'),
    r('e-band', 2, 'Vilken serie tillhör motståndet?', 'Bara toleransbandet avgör: guld, silver, brun, röd eller tre band.', 'Flerval', STD,
      'Ringen runt toleransbandet, lappen "Guld ±5 %" och pilen till serien. Rätt knapp lyser upp.'),
    r('e-band-svar', 3, 'Vilken serie, svårare', 'Också grön, blå och violett (E192), sex band och vända motstånd.', 'Flerval', STD,
      'Vänt motstånd vänds rätt, sedan ringen, lappen och pilen. På sex band: temperaturbandet är inte tolerans.'),
    r('e-multi', 3, 'Samma siffror', '3,3 Ω finns i E6. Vilken finns inte i E6?', VSB, POP,
      'Svaren delas upp i siffror och multiplikator: tre har samma siffror (✓), det udda andra (✗).'),
    r('e-sakert', 3, 'Räcker säkert?', 'Du behöver 3,4 kΩ ±10 %. Vilken är den grövsta serien som säkert räcker? Tabell med värden.', 'Flerval', STD,
      'Tallinjen: fönstret i grönt, seriernas staplar glider in, rött där de sticker ut, den första som ryms är grön.'),
    r('e-blandat', 4, 'Allt blandat', 'Motståndet med bandet, räcker, svåra motstånd, samma siffror och räcker säkert.', 'Flerval', STD,
      'Som på respektive grad.')
  ],
  ultra: [
    r('ultra-fragor', 0, 'Frågorna', '4 frågor per ämne, 20 totalt, i blandad ordning. Alla är Stormästare-frågan i sitt ämne.', 'Som i ämnet',
      'Neutral: ett registrerat-klick, inget rätt eller fel, nästa själv', 'Samma som rätt (man ser inte om det blev fel)'),
    r('ultra-resultat', 0, 'Resultatet', '3 av 4 i ett ämne ger Mästare, 4 av 4 klarar ämnet. Provet kan bara höja.', 'Resultatkort',
      'Resultatkortet listar varje ämne', '–')
  ]
};

const KEY = 'fargkoden-dev';
const clone = x => JSON.parse(JSON.stringify(x));
let state = {base: clone(CATALOG), rows: clone(CATALOG), tab: 'body'};
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && saved.base && saved.rows) state = {tab: 'body', ...saved};
} catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
document.getElementById('notice').hidden = JSON.stringify(state.base) === JSON.stringify(CATALOG);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const ta = (f, v) => `<textarea data-f="${f}" rows="1" aria-label="${FIELDS.find(x => x[0] === f)[1]}">${esc(v)}</textarea>`;
const baseRow = (tab, id) => state.base[tab].find(x => x.id === id);
const changed = (tab, row) => { const b = baseRow(tab, row.id); return !b || JSON.stringify(b) !== JSON.stringify(row); };

function render(){
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const n = state.rows[t.id].filter(x => changed(t.id, x)).length + state.base[t.id].filter(b => !state.rows[t.id].some(x => x.id === b.id)).length;
    return `<button role="tab" data-tab="${t.id}" aria-selected="${t.id === state.tab}">${t.name}${n ? `<span class="n">${n} ändr.</span>` : ''}</button>`;
  }).join('');
  const tab = state.tab, rows = state.rows[tab];
  document.getElementById('rows').innerHTML = groupsOf(tab).map(g => {
    const list = rows.filter(x => x.g === g), cls = g === IDEA ? ' idea' : '';
    if (!list.length) return `<tr class="first empty${cls}" data-g="${g}"><td class="grade">${groupName(tab, g)}</td><td></td><td colspan="8">${g === IDEA ? 'Dra hit eller tryck + Ny frågetyp' : 'Tom grad: dra hit en frågetyp'}</td></tr>`;
    return list.map((x, i) => `<tr data-id="${x.id}" data-g="${g}" class="${i ? '' : 'first'}${cls}${changed(tab, x) ? ' changed' : ''}">
      <td class="grade">${groupName(tab, g)}</td>
      <td class="handle" draggable="true" title="Dra för att flytta">⠿</td>
      <td>${ta('name', x.name)}</td><td>${ta('q', x.q)}</td><td>${ta('kind', x.kind)}</td>
      <td>${ta('right', x.right)}</td><td>${ta('wrong', x.wrong)}</td>
      <td><select data-f="status" aria-label="Status">${STATUS.concat(STATUS.includes(x.status) ? [] : [x.status]).map(s => `<option${s === x.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></td>
      <td>${ta('comment', x.comment)}</td>
      <td class="acts">${g === IDEA ? '' : `<a class="btn show" href="index.html?test=true&topic=${tab}${tab === 'ultra' ? '' : `&grade=${g}`}" title="Visa spelet i en panel">Visa</a>`}<button class="del" title="Ta bort">✕</button></td>
    </tr>`).join('');
  }).join('');
}

// Flyttar raden id före eller efter raden target (eller sist i en tom grad: target är då ett gradnummer)
function move(tab, id, target, after){
  const rows = state.rows[tab], i = rows.findIndex(x => x.id === id);
  if (i < 0 || id === target) return;
  const [row] = rows.splice(i, 1);
  if (typeof target === 'number') { row.g = target; rows.push(row); }
  else {
    const j = rows.findIndex(x => x.id === target);
    row.g = rows[j].g;
    rows.splice(after ? j + 1 : j, 0, row);
  }
  save(); render();
}

// Prompten: allt som skiljer sig från katalogen, ämne för ämne
function genPrompt(){
  const out = [];
  for (const t of TABS) {
    const B = state.base[t.id], R = state.rows[t.id], lines = [];
    const label = (row, g = row.g) => `${groupName(t.id, g)} · ${row.name}`;
    for (const b of B) if (!R.some(x => x.id === b.id)) lines.push(`- Ta bort: ${label(b)}`);
    for (const x of R) {
      const b = B.find(y => y.id === x.id);
      if (!b) {
        lines.push(`- Ny frågetyp under ${groupName(t.id, x.g)}: "${x.name}"` +
          FIELDS.filter(([f]) => f !== 'name' && x[f]).map(([f, n]) => `\n  - ${n}: "${x[f]}"`).join(''));
        continue;
      }
      const ch = [];
      if (b.g !== x.g) ch.push(`  - flyttad från ${groupName(t.id, b.g)} till ${groupName(t.id, x.g)}`);
      for (const [f, n] of FIELDS) {
        if (b[f] === x[f]) continue;
        ch.push(f === 'comment' ? `  - Kommentar: "${x[f]}"` : `  - ${n}: "${b[f]}" → "${x[f]}"`);
      }
      if (ch.length) lines.push(`- ${label(b, b.g)}\n${ch.join('\n')}`);
    }
    // Ordningen inom en grad, bland rader som fanns där förut
    for (const g of groupsOf(t.id)) {
      const before = B.filter(b => b.g === g).map(b => b.id);
      const now = R.filter(x => x.g === g).map(x => x.id);
      const keep = id => before.includes(id) && now.includes(id);
      const moved = now.some(id => !before.includes(id) && baseRow(t.id, id));
      if (before.filter(keep).join() !== now.filter(keep).join() || (moved && now.length > 1))
        lines.push(`- Ny ordning på ${groupName(t.id, g)}: ${R.filter(x => x.g === g).map(x => x.name).join(', ')}`);
    }
    if (lines.length) out.push(`## ${t.name}\n${lines.join('\n')}`);
  }
  if (!out.length) return 'Inga ändringar.';
  return 'Ändringar från dev.html för Färgkoden. Uppdatera index.html så att spelet följer dem, ' +
    'och uppdatera katalogen i dev.html så att den beskriver det nya spelet. Fråga om något är oklart.\n\n' + out.join('\n\n');
}

const rowsEl = document.getElementById('rows');
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) { state.tab = b.dataset.tab; save(); render(); }
});
rowsEl.addEventListener('input', e => {
  const f = e.target.dataset.f, tr = e.target.closest('tr[data-id]');
  if (!f || !tr) return;
  const row = state.rows[state.tab].find(x => x.id === tr.dataset.id);
  row[f] = e.target.value;
  tr.classList.toggle('changed', changed(state.tab, row));
  save();
});
rowsEl.addEventListener('change', e => { if (e.target.tagName === 'SELECT') render(); });
// Bekräftelse på själva knappen: första trycket frågar, andra gör det. Webbläsarens dialogrutor är blockerade i artifacts.
function armed(btn, label, ask = 'Säker? Tryck igen'){
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.textContent = ask;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 3000);
  return false;
}
// Visa: spelet öppnas i panelen. En ny flik fungerar inte i en artifact, där filerna bara får visas inuti sidan.
const viewer = document.getElementById('viewer'), vframe = viewer.querySelector('iframe');
rowsEl.addEventListener('click', e => {
  const a = e.target.closest('a.show');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  const tr = a.closest('tr'), row = state.rows[state.tab].find(x => x.id === tr.dataset.id);
  viewer.querySelector('.vtitle').textContent = `${TABS.find(t => t.id === state.tab).name} · ${groupName(state.tab, row.g)} · ${row.name}`;
  vframe.setAttribute('src', a.getAttribute('href'));
  viewer.hidden = false; document.body.classList.add('viewing');
});
viewer.querySelector('.vclose').addEventListener('click', () => { viewer.hidden = true; document.body.classList.remove('viewing'); vframe.removeAttribute('src'); });
viewer.querySelector('.vreload').addEventListener('click', () => { const src = vframe.getAttribute('src'); vframe.setAttribute('src', 'about:blank'); setTimeout(() => vframe.setAttribute('src', src), 30); });
rowsEl.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if (!del) return;
  const id = del.closest('tr').dataset.id;
  if (!armed(del, '✕', 'Säker?')) return;
  state.rows[state.tab] = state.rows[state.tab].filter(x => x.id !== id);
  save(); render();
});
document.getElementById('add').addEventListener('click', () => {
  const id = 'ny-' + Date.now().toString(36);
  state.rows[state.tab].push({id, g: IDEA, name: '', q: '', kind: '', right: '', wrong: '', status: 'idé', comment: ''});
  save(); render();
  const el = rowsEl.querySelector(`tr[data-id="${id}"] [data-f=name]`);
  if (el.focus) el.focus();
});

// Dra och släpp: handtaget dras, raden markerar var den hamnar
let dragId = null;
const clearDrop = () => rowsEl.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
rowsEl.addEventListener('dragstart', e => {
  const tr = e.target.closest && e.target.closest('tr[data-id]');
  if (!tr) return;
  dragId = tr.dataset.id; tr.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  e.dataTransfer.setDragImage(tr, 20, 20);
});
rowsEl.addEventListener('dragend', () => { dragId = null; clearDrop(); rowsEl.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
const dropAt = e => {
  const tr = e.target.closest('tr[data-g]');
  if (!tr) return null;
  if (!tr.dataset.id) return {tr, target: +tr.dataset.g, after: false};
  const box = tr.getBoundingClientRect();
  return {tr, target: tr.dataset.id, after: e.clientY > box.top + box.height / 2};
};
rowsEl.addEventListener('dragover', e => {
  if (!dragId) return;
  const d = dropAt(e);
  if (!d) return;
  e.preventDefault(); clearDrop();
  d.tr.classList.add(d.after ? 'drop-after' : 'drop-before');
});
rowsEl.addEventListener('drop', e => {
  const d = dragId && dropAt(e);
  if (!d) return;
  e.preventDefault();
  move(state.tab, dragId, d.target, d.after);
});

document.getElementById('gen').addEventListener('click', () => {
  document.getElementById('out').hidden = false;
  document.getElementById('prompt').value = genPrompt();
  document.getElementById('copied').textContent = '';
});
document.getElementById('copy').addEventListener('click', async () => {
  const p = document.getElementById('prompt');
  try { await navigator.clipboard.writeText(p.value); } catch(e) { p.select(); document.execCommand('copy'); }
  document.getElementById('copied').textContent = 'Kopierad';
});
document.getElementById('reset').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (!armed(btn, 'Återställ', 'Säker? Tryck igen')) return;
  delete btn.dataset.armed; btn.textContent = 'Återställ';
  state = {base: clone(CATALOG), rows: clone(CATALOG), tab: state.tab};
  save(); render();
  document.getElementById('notice').hidden = true;
  document.getElementById('out').hidden = true;
});
render();
</script>
</body>
