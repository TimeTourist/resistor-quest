<style>
:root{
  --bg:#e8edf0;--grid:rgba(31,111,178,.08);--surface:#fff;--ink:#1d2730;--muted:#566673;--line:#c8d1d8;
  --accent:#1f6fb2;--accent-ink:#fff;--ok:#24803a;--ok-bg:#e3f3e6;--bad:#b83227;--bad-bg:#f8e4e1;--tip-bg:#fbefcf;--gap:#e0a526;
  --body:#dcc596;--lead:#98a1a8;--start-a:#e3f0fc;--start-b:#c4ddf5;--start-line:#1f6fb2;--k-odd:#f4edfc;--k-odd-line:#8a5cc7;--k-point:#fdf3e0;--k-point-line:#c98a12;--k-entry:#e4f4f1;--k-entry-line:#1f8a78;--k-point-tag:#8a5e0a;--k-entry-tag:#17705f;--k-order-tag:#a83a56;--k-order:#fdeef2;--k-order-line:#c94f6d;

}

  :root:not([data-theme="light"]){
    --bg:#121a20;--grid:rgba(90,166,230,.07);--surface:#1b252d;--ink:#e4ebf0;--muted:#92a2ae;--line:#304049;
    --accent:#5aa6e6;--accent-ink:#0d1a24;--ok:#6fcf86;--ok-bg:#183222;--bad:#ef8a7e;--bad-bg:#3a1d1a;--tip-bg:#3a3117;--gap:#e7b04a;--lead:#7d878e;--start-a:#173450;--start-b:#0f2236;--start-line:#5aa6e6;--k-odd:#262038;--k-odd-line:#b38ff0;--k-point:#2e2717;--k-point-line:#e3b04a;--k-entry:#15302b;--k-entry-line:#5cc8b4;--k-point-tag:#e3b04a;--k-entry-tag:#5cc8b4;--k-order-tag:#f08aa2;--k-order:#36202a;--k-order-line:#f08aa2;--fog:rgba(38,50,60,.92);
  }
}
:root[data-theme="dark"]{
  --bg:#121a20;--grid:rgba(90,166,230,.07);--surface:#1b252d;--ink:#e4ebf0;--muted:#92a2ae;--line:#304049;
  --accent:#5aa6e6;--accent-ink:#0d1a24;--ok:#6fcf86;--ok-bg:#183222;--bad:#ef8a7e;--bad-bg:#3a1d1a;--tip-bg:#3a3117;--gap:#e7b04a;--lead:#7d878e;--start-a:#173450;--start-b:#0f2236;--start-line:#5aa6e6;--k-odd:#262038;--k-odd-line:#b38ff0;--k-point:#2e2717;--k-point-line:#e3b04a;--k-entry:#15302b;--k-entry-line:#5cc8b4;--k-point-tag:#e3b04a;--k-entry-tag:#5cc8b4;--k-order-tag:#f08aa2;--k-order:#36202a;--k-order-line:#f08aa2;--fog:rgba(38,50,60,.92);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
/* Ballonger och gnistor får gå utanför kortet utan att sidan kan skrollas i sidled */
html,body{overflow-x:clip}
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.home{align-self:flex-start;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none}
.home:hover{color:var(--accent)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1;margin:0;display:flex;align-items:center;gap:8px}
.brandbands{display:inline-flex;gap:3px}
.brandbands b{width:5px;height:.75em;border-radius:1px;display:block}
.seg{display:flex;flex-direction:column;gap:6px}
.seg>span{font-size:.85rem;color:var(--muted)}
.seg>div{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.lvcard h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2.2rem;line-height:1;margin:0 0 10px}
.lvcard p{margin:0 0 10px}
.lvcard .state{border-radius:10px;padding:8px 12px;background:var(--bg)}
.lvcard .state.done{background:var(--ok-bg)}
.card.kind-odd{background:var(--k-odd);border-color:var(--k-odd-line)}
.card.kind-point{background:var(--k-point);border-color:var(--k-point-line)}
.card.kind-entry{background:var(--k-entry);border-color:var(--k-entry-line)}
.card.kind-order{background:var(--k-order);border-color:var(--k-order-line)}
.kind-order .kindtag{background:var(--k-order-tag);color:var(--surface)}
.ordrow{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;margin:14px 0 18px}
.oslot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.oslot span{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.05rem;line-height:1;white-space:nowrap}
.ord-m .oslot span{font-size:.78rem}
.ord-t .oslot span{font-size:.7rem;letter-spacing:-.02em}
.bracket text .hl{fill:var(--ink);font-weight:800;font-size:16px;text-decoration:underline}
.bslot{cursor:pointer}
.bslot rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.bslot text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:15px;fill:var(--ink)}
.bslot.sel rect{stroke:var(--accent);stroke-width:2.5}
.bslot.ok rect{stroke:var(--ok);fill:var(--ok-bg)}
.bslot.bad rect{stroke:var(--bad);fill:var(--bad-bg)}
.bsel{stroke:var(--accent)}
.betabs{display:flex;gap:6px;margin-bottom:10px}
.betabs button{flex:1;font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:6px 10px;cursor:pointer}
.betabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bemults{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.obox{display:block;width:100%;aspect-ratio:3/4;max-width:34px;border:2px dashed var(--line);border-radius:6px;background:var(--surface);position:relative}
.obox.ok{border:2px solid var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.obox.bad{border:2px solid var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.osw{position:absolute;inset:3px;border-radius:3px;display:block;z-index:5}
.obox.fly{border-style:solid;border-color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .obox.ok.landnow .osw{animation:oland .35s ease-out}
  .obox.bad.landnow{animation:shake .4s ease-in-out}
  .ochip.hint{animation:hintshake .55s ease-in-out 4}
  @keyframes hintshake{20%{transform:rotate(-8deg) scale(1.08)}40%{transform:rotate(7deg) scale(1.08)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
  .ordnote{animation:notein .5s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes notein{from{transform:scale(.7);opacity:0}}
  @keyframes oland{40%{transform:scale(1.25)}}
}
.opool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ochip{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.ochip.gone{visibility:hidden}
.ochip.hint{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ok),0 0 14px var(--ok)}
.ofloat{position:absolute;z-index:60;border-radius:10px;border:2px solid var(--line);pointer-events:none}
.ochip.val{width:auto;min-width:46px;height:auto;min-height:46px;padding:2px 8px;background:var(--surface);color:var(--ink);font:700 .9rem var(--text);font-variant-numeric:tabular-nums;display:grid;justify-items:center;gap:0}
.ofloat.val{display:grid;place-items:center;background:var(--bad);border-color:var(--bad);color:var(--surface);font:700 .9rem var(--text)}
.escale{position:relative;height:96px;margin:28px 6px 8px}
.escale .eaxis{position:absolute;left:3%;right:3%;top:52px;height:2px;background:var(--ink)}
.escale .etk{position:absolute;top:52px;width:1px;height:8px;background:var(--muted)}
.escale .etk b{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:400 .75rem var(--text);color:var(--muted);white-space:nowrap}
.escale .eslot{position:absolute;top:30px;width:30px;height:22px;max-width:none;aspect-ratio:auto;transform:translateX(-50%);border-radius:6px}
.escale.lin .eslot.r0{top:18px}
.escale.lin .eslot.r1{top:-10px}
.escale.lin .eslot.r2{top:-38px}
.escale.lin .eslot::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;margin-left:-1px;background:var(--accent)}
.escale.lin .eslot.r1::after{height:40px}
.escale.lin .eslot.r2::after{height:68px}
.escale.lin{margin-top:56px}
.escale .enext{position:absolute;top:44px;width:16px;height:16px;transform:translateX(-50%);border:2px dashed var(--muted);border-radius:50%}
.escale .escap{position:absolute;right:3%;top:76px;margin:0;font-size:.75rem;color:var(--muted)}
.escale.arcs{height:44px;margin-top:4px}
.earc{position:absolute;top:18px;height:22px;border:2px solid var(--ok);border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.earc b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:var(--ok);font:700 .8rem var(--text)}
.ochip.val .eres svg{display:block;width:56px;height:auto}
.ofloat.val .eres svg{display:block;width:56px;height:auto}
.escale.bars{height:60px;margin-top:0}
.ebarl{position:absolute;top:8px;height:9px;border-radius:3px;background:var(--accent);opacity:.55}
.ebarl.alt{top:20px;opacity:.35}
.escale.bars .escap{top:36px;left:3%;right:auto}
@media (prefers-reduced-motion:no-preference){.ebarl.grow{transform-origin:center;animation:lgrow .5s ease-out both}}
.escale .osw.val{font-size:.72rem;letter-spacing:-.02em}
.osw.val{display:grid;place-items:center;background:var(--ok);color:var(--surface);font:700 .8rem var(--text);white-space:nowrap}
.ordnote{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:var(--k-order-line);color:var(--surface);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.25rem;text-align:center}
.ochip.cheat::after{left:2px;top:1px}
.kindtag{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--bg);color:var(--muted)}
.kind-point .kindtag{background:var(--k-point-tag);color:var(--surface)}
.kind-entry .kindtag{background:var(--k-entry-tag);color:var(--surface)}
.kind-odd .oddhead svg{color:var(--k-odd-line)}
@media (prefers-reduced-motion: no-preference){
}
.card.bosscard{color:#ffe8d2;border:0;background:radial-gradient(120% 90% at 50% 110%,#ff9a3c,#d9381e 45%,#2a1712 85%)}
.bosscard .primary{background:#ffe8d2;color:#2a1712}
.soundbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.soundbtn svg{width:22px;height:22px}
.soundbtn[aria-pressed="false"]{color:var(--muted)}
.soundbtn:hover{border-color:var(--accent)}
/* Klammern över ohm-banden */
.bracket path{stroke:var(--accent)}
.bracket text{fill:var(--accent);font-family:"IBM Plex Sans",system-ui,sans-serif}
.bracket.ok path{stroke:var(--ok)}.bracket.ok text{fill:var(--ok)}
.bracket.bad path{stroke:var(--bad)}
.note path{stroke:var(--ink)}
.sweep path{stroke:var(--ok)}
.note text{fill:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;font-weight:700}
.blab{fill:var(--muted)}
.calcrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:14px 0 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;font-weight:600}
.calcrow .zeros{color:var(--ok);margin-left:-8px}
.calcrow .pre{color:var(--ok)}
.calcrow .sep{margin-left:0}
.ring.walk{stroke:var(--accent);opacity:0}
.palstrip{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:14px 0 0;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.palstrip .sw{width:16px;height:16px}
.palstrip .fake{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 8px 2px 4px;border-radius:999px;background:var(--bad);color:var(--surface);font-weight:700}
/* Vilken ska bort?: det som ska bort är borta, platsen står kvar */
.opt.gone{visibility:hidden}
.opt.picked{box-shadow:inset 0 0 0 3px var(--bad)}
@media (prefers-reduced-motion:reduce){.opt.gone.reveal{visibility:visible;opacity:.55}}
/* Svarsanimeringen */
#q{position:relative}
.fx{position:absolute;width:0;height:0;pointer-events:none;z-index:4}
.fx i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%}
.fx.spark i{left:-11px;top:-11px;width:22px;height:22px;background:radial-gradient(circle,#fff 0 25%,#ffd84a 45%,rgba(255,170,0,0) 72%);box-shadow:0 0 12px 4px rgba(255,200,40,.7)}
.fx.out i{left:-11px;top:-11px;width:22px;height:22px}
.fx.won i{background:radial-gradient(circle,#eaffef 0 25%,#3ad66a 55%,rgba(58,214,106,0) 75%);box-shadow:0 0 18px 8px rgba(58,214,106,.55)}
.fx.lost i{background:radial-gradient(circle,#ffd0c8 0 20%,#d9381e 55%,rgba(217,56,30,0) 75%)}
.fx.neutral i{background:radial-gradient(circle,#fff 0 25%,var(--accent) 55%,rgba(0,0,0,0) 75%)}
.fx b{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#ffd84a}
.fx.party b{width:8px;height:8px;left:-4px;top:-4px}
.fx.party b:nth-child(3n){background:var(--accent)}.fx.party b:nth-child(3n+1){background:#3ad66a}
.fx s{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:rgba(120,120,120,.55);text-decoration:none}
@media (prefers-reduced-motion:no-preference){
  .fx.spark i{animation:sparkgo .9s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes sparkgo{0%{transform:translateX(0) scale(.6)}88%{transform:translateX(var(--dx)) scale(1.1)}100%{transform:translateX(var(--dx)) scale(1.5);opacity:.9}}
  .fx.won i{animation:ledon 1s ease-out forwards}
  @keyframes ledon{0%{transform:scale(.4)}35%{transform:scale(1.6)}100%{transform:scale(1);opacity:0}}
  .fx.won b{animation:burst .75s ease-out forwards}
  .fx.party b{animation-duration:1.2s}
  @keyframes burst{0%{transform:rotate(var(--a)) translateX(0);opacity:1}100%{transform:rotate(var(--a)) translateX(46px);opacity:0}}
  .fx.party b{animation-name:burstbig}
  @keyframes burstbig{0%{transform:rotate(var(--a)) translateX(0);opacity:1}100%{transform:rotate(var(--a)) translateX(110px) translateY(30px);opacity:0}}
  .fx.lost i{animation:fizz .6s steps(6) forwards}
  @keyframes fizz{0%,100%{opacity:0}20%,60%{opacity:1}40%,80%{opacity:.2}}
  .fx.lost s{animation:smoke 1.4s ease-out forwards;opacity:0}
  .fx.lost s:nth-of-type(2){animation-delay:.15s;left:-2px}.fx.lost s:nth-of-type(3){animation-delay:.3s;left:-14px}
  @keyframes smoke{0%{transform:translateY(0) scale(.4);opacity:.8}100%{transform:translateY(-46px) scale(2.2);opacity:0}}
  .fx.neutral i{animation:ledon .6s ease-out forwards}
  .pending{animation:pend .45s ease-in-out infinite alternate}
  @keyframes pend{to{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 4px rgba(31,111,178,.25)}}
  #q .opt.ok:not(.picked){animation:okpop .35s ease-out}
  @keyframes okpop{50%{transform:scale(1.04)}}
  .opt.gone.popnow{visibility:visible;animation:balloon .55s ease-in forwards}
  .opt.gone.popdelay{visibility:visible;animation:wobble .5s ease-in-out infinite,balloon .55s ease-in var(--pd,1.6s) forwards}
  .opt.gone.popdelay{box-shadow:inset 0 0 0 3px var(--accent)}
  @keyframes balloon{0%{transform:scale(1)}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1.35);opacity:0;visibility:hidden}}
  @keyframes wobble{50%{transform:scale(1.04)}}
  .opt.picked.shake{animation:shake .5s ease-in-out}
  @keyframes shake{20%{transform:translateX(-8px) scale(1.06)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .mk{animation:ain .25s ease-out both}
  .ring.walk{animation:ringwalk .45s ease-out both}
  @keyframes ringwalk{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  .sweep .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  .opt.land{animation:land .5s ease-out both}
  @keyframes land{50%{transform:scale(1.1);box-shadow:0 0 0 4px var(--ok-bg)}}
  .scale span.walk{animation:walk .3s ease-out both}
  @keyframes walk{40%{border-color:var(--accent);color:var(--ink);background:var(--bg)}}
  .scale span.land{animation:landon .35s ease-out both}
  @keyframes landon{from{border:1px solid var(--line);color:var(--muted);background:transparent;transform:scale(1)}60%{transform:scale(1.15)}}
  .badge{animation:badgein .3s ease-out both}
  @keyframes badgein{from{opacity:0;transform:scale(.4)}}
  .tapcue svg{animation:press 1.1s ease-in-out calc(var(--wait,0s) + .3s) infinite}
  @keyframes press{0%,60%,100%{transform:translate(0,0) scale(1)}30%{transform:translate(-3px,-4px) scale(.88)}}
}
/* Stapeln överst i spelkortet */
.gbar{position:relative;max-width:720px;margin:0 auto;padding:12px 16px 4px;pointer-events:none}
#gbar .gname{display:none}
.examprog{font-family:var(--display);font-size:1.3rem;text-align:center}
.gname{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.gname{font-weight:600;color:var(--ink)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gseg span{display:block;text-align:center;font-size:.68rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.gseg.cur span{color:var(--ink);font-weight:700}
.gseg.cur .cells{outline:2px solid var(--ink);outline-offset:2px;border-radius:5px}
.cells{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:16px}
.cells i{display:block;border-radius:3px;border:1.5px solid var(--line);background:var(--bg)}
.gbar{--fresh:#8fe25f;--ripe:#2a9b48}
.gbar.float{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--surface);border-radius:0 0 14px 14px;padding-bottom:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){
  .gbar.float{animation:floatin .25s ease-out}
  .gbar.float.leave{animation:floatout .25s ease-in forwards}
  @keyframes floatin{from{transform:translateY(-100%)}}
  @keyframes floatout{to{transform:translateY(-100%)}}

/* Startsidan: sex minikort, ett per ämne och Eldprovet */

/* Spelkortet: ett minikort som zoomats upp */

.inkey{position:absolute;left:calc(50% - 64px);top:calc(54% - 2px);width:70px;z-index:3;pointer-events:none;transform-origin:92% 50%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));

// Taggiga sprickor från en punkt (i pixlar)
function crackPaths(cx, cy, n, len){
  let d = '';
  for (let j = 0; j < n; j++) {
    let a = Math.random() * Math.PI * 2, x = cx, y = cy;
    d += `<path pathLength="1" d="M${x.toFixed(1)} ${y.toFixed(1)}`;
    const steps = 3 + Math.floor(Math.random() * 3), step = len * (.7 + Math.random() * .6) / steps;
    for (let k = 0; k < steps; k++) { a += (Math.random() - .5) * .9; x += Math.cos(a) * step; y += Math.sin(a) * step; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
    d += '"/>';
  }
  return d;
}

// Kortet spricker i skärvor som faller och avslöjar det som renderas under (fn)
function shatter(fn, at){
  const q = document.getElementById('q');
  if (S.instant || reduceMotion() || !q.animate) { fn(); return; }
  const r = q.getBoundingClientRect(), ghost = q.cloneNode(true);
  ghost.removeAttribute('id'); ghost.removeAttribute('aria-live');
  ghost.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
  fn();
  const box = document.createElement('div');
  box.className = 'shatter'; box.setAttribute('aria-hidden', 'true');
  box.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const cx = cl(((at ? at.x : r.left + r.width / 2) - r.left) / r.width * 100, 10, 90);
  const cy = cl(((at ? at.y : r.top + r.height / 2) - r.top) / r.height * 100, 10, 90);
  // Punkter runt kanten (hörnen med), i ordning medurs. Varje skärva är en triangel från träffpunkten.
  const ps = [0, 1, 2, 3].concat(Array.from({length: 12}, () => Math.random() * 4)).sort((a, b) => a - b);
  const pt = p => p < 1 ? [p * 100, 0] : p < 2 ? [100, (p - 1) * 100] : p < 3 ? [(3 - p) * 100, 100] : [0, (4 - p) * 100];
  const rim = ps.map(pt);
  box.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${rim.map(([x, y]) => `<path vector-effect="non-scaling-stroke" d="M${cx} ${cy} L${x} ${y}"/>`).join('')}</svg>`;
  rim.forEach((a, i) => {
    const b = rim[(i + 1) % rim.length];
    if (Math.abs(a[0] - b[0]) < .01 && Math.abs(a[1] - b[1]) < .01) return;
    const sh = ghost.cloneNode(true);
    sh.style.clipPath = `polygon(${cx}% ${cy}%, ${a[0]}% ${a[1]}%, ${b[0]}% ${b[1]}%)`;
    box.appendChild(sh);
    const mx = (cx + a[0] + b[0]) / 3 - cx, my = (cy + a[1] + b[1]) / 3 - cy, len = Math.hypot(mx, my) || 1;
    const dx = mx / len * (40 + Math.random() * 80), dy = 260 + Math.random() * 260, rot = (Math.random() - .5) * 70;
    sh.animate([{transform: 'none', opacity: 1}, {transform: `translate(${dx * .5}px,${-20 - Math.random() * 30}px) rotate(${rot * .3}deg)`, opacity: 1, offset: .25},
      {transform: `translate(${dx}px,${dy}px) rotate(${rot}deg)`, opacity: 0}],
      {duration: 900 + Math.random() * 400, delay: 120 + Math.random() * 80, easing: 'cubic-bezier(.4,0,.9,.5)', fill: 'both'});
  });
  box.querySelector('svg').animate([{opacity: 1}, {opacity: 0}], {duration: 200, delay: 100, fill: 'forwards'});
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1700);
}

// Har man skrollat ner till svaren ligger stapeln ovanför skärmen. Då glider den in överst medan den fylls,
// och en lucka på dess plats håller kortet stilla.
function floatBar(b){
  if (b.getBoundingClientRect().top >= 0 || document.getElementById('gbargap')) return;
  const gap = document.createElement('div');
  gap.id = 'gbargap'; gap.style.height = b.offsetHeight + 'px';
  b.before(gap);
  b.classList.add('float');
}
function sinkBar(b){
  if (!b.classList.contains('float')) return;
  const done = () => { b.classList.remove('float', 'leave'); document.getElementById('gbargap')?.remove(); };
  if (reduceMotion()) { done(); return; }

}
function barDraw(st, topic, label){
  const b = document.getElementById('gbar');
  // Under aktuell grad: fylld mörkgrön. Aktuell: rätt i rad i ljusgrönt. Över men klarad tidigare: blek. Annars tom.
  // Fel i rad gör graden under röd från höger, dit man halkar vid tre fel. Nykomling har ingen grad under.
  const red = (g, i) => g === st.g - 1 && i >= 3 - (st.down || 0);
  const segs = GRADE_NAME.map((n, g) => {
    const cur = g === st.g, fill = i => g < st.g ? (red(g, i) ? 'full bad' : 'full') : cur ? (i < st.up ? 'on' : '') : g < (st.done || 0) ? 'was' : '';

  }).join('');

}
// Damm som flyger till en punkt (to) eller faller och försvinner (to saknas). Punkterna är skärmkoordinater.
function dust(from, to, n, cls){
  if (!from) return;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i');
    d.className = 'dust ' + cls; d.style.left = from.x + 'px'; d.style.top = from.y + 'px';
    document.body.appendChild(d);
    const jx = Math.random() * 30 - 15, jy = -6 - Math.random() * 14;
    const dx = to ? to.x - from.x : jx * 1.5, dy = to ? to.y - from.y : 45 + Math.random() * 35;
    const ms = to ? 520 : 750;
    if (d.animate) d.animate([{transform: `translate(${jx}px,${jy}px)`, opacity: 1}, {transform: `translate(${dx}px,${dy}px) scale(${to ? .4 : .7})`, opacity: to ? 1 : 0}],
      {duration: ms, delay: i * 35, easing: to ? 'cubic-bezier(.5,0,.9,.6)' : 'ease-in', fill: 'forwards'});
    later((ms + i * 35) / 1000 + .05, () => d.remove());
  }
}

// Gyllene: en våg av guld går genom alla fack, och gnistor sprutar ur stapeln
function goldFX(b, at){

    const r = b.getBoundingClientRect(), c = {x: r.left + r.width / 2, y: r.top + r.height / 2};

function barFX(P, startAt){

  // Fack i en grad: g är graden (0–4), i facket (0–2)
  const cellEl = (g, i) => b.querySelectorAll('.gseg')[g]?.querySelectorAll('.cells i')[i];
  const cell = (g, i) => { const c = cellEl(g, i); if (!c) return null; const r = c.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };

    later(startAt + .85, () => {

      // De röda facken på graden under läker tillbaka till grönt

    });

      later(startAt + 1.55, () => { b.classList.remove('quake'); barDraw(P.to, P.topic, P.moved === 'top' ? 'klart ✓' : null); b.classList.add('newgrade'); });
      if (P.moved === 'top') { goldFX(b, startAt + 1.7); later(startAt + 3.9, () => { b.classList.remove('show'); sinkBar(b); }); }

      later(startAt + .95, () => {

        if (!calm) [0, 1, 2].forEach(i => dust(cell(P.to.g, i), null, 7, 'out bad'));

}

// Knappsats och värdelistor för Läs av i svår variant
const MULTS = [0.01, 0.1, 1, 10, 100, 1e3, 1e4, 1e5, 1e6];

// Knappa in på Stormästare: man trycker på ett band och skriver dess siffra, eller väljer multiplikatorn under fliken ×.

const BE_MULTS = [0.01, 0.1, 1, 10, 100, 1e3, 1e4, 1e5, 1e6, 1e7];

function beHTML(){

const newEntry = () => ({v:'', t:'', k:'', mult:null, tol:null, tc:null, field:'v'});

function keyPress(k){

// Färgen flyger från knappen upp mot lådan. Flygturen är spänning: rätt eller fel syns och hörs först när den landar.
// Rätt färg sätter sig grön i sin låda. Var femte låtsas först flyga mot en annan tom låda, vänder och sätter sig rätt.
// Fel färg landar i sin egen låda, blir röd, skakar och flyger tillbaka. Sedan skakar den rätta färgen med en grön ring.
// Utan fel är frågan rätt. Med fel i första försöket flyger alla tillbaka och man får ett sista försök, utan ledtråd
// förrän man gör fel igen. Färgerna ligger kvar i samma ordning. Fel i sista försöket gör frågan fel, men raden byggs klart.
// Man kan klicka snabbt: flera färger kan vara i luften samtidigt. Rätt eller fel avgörs vid klicket men visas vid landningen.
// Lådorna och knapparna uppdateras på plats, så att en ny klickning inte avbryter de som flyger.
const FLY_MS = 650, FAKE_MS = 1150, HINT_MS = 2600;
const calmOrder = () => S.instant || reduceMotion();

// Knapparna efter läget: borta om färgen sitter i en låda eller flyger, grön ledtråd, testlägets pil
function syncChips(){
  const o = S.ord, want = o.keys.find(k => !o.placed[k]);
  o.keys.forEach(k => {
    const c = ochip(k); if (!c) return;
    const gone = !!o.placed[k] || o.away.has(k);
    c.classList.toggle('gone', gone); c.disabled = !!o.placed[k] || S.answered;
    c.classList.toggle('hint', o.hint === k);
    c.classList.toggle('cheat', showCheat() && !S.answered && k === want);
  });
}
function orderPick(btn){
  const o = S.ord;
  if (S.answered || S.busy || !o || o.reset) return;
  const k = btn.dataset.ord, want = o.keys.find(x => !o.placed[x]);
  if (o.placed[k] || o.away.has(k)) return;
  if (k !== want) { orderMiss(btn, k, want); return; }
  o.placed[k] = 'ok'; o.hint = null;
  const empty = o.keys.filter(x => !o.placed[x]);
  o.decoy = empty.length && Math.random() < (o.fakeRate ?? .2) ? rnd(empty) : null;
  const from = btn.getBoundingClientRect(), calm = calmOrder(), decoy = o.decoy;
  const box = oslot(k);
  box.classList.add('fly');
  box.innerHTML = oswHTML(k);
  syncChips();
  o.inflight++;
  const land = () => {
    if (S.ord !== o) return;
    o.inflight--; o.landed.add(k);
    // Bara lådan som just landade studsar. De som redan ligger still rör sig inte.
    document.querySelectorAll('#q .obox.landnow').forEach(b => b.classList.remove('landnow'));
    box.classList.remove('fly'); box.classList.add('ok', 'landnow');
    sfx.blip(o.landed.size);

  };
  if (calm) { land(); return; }
  sfx.whoosh();
  const sw = box.querySelector('.osw'), dur = decoy ? FAKE_MS : FLY_MS;
  if (sw.animate) {
    const to = sw.getBoundingClientRect();
    if (to.width) {
      const start = `translate(${from.left - to.left}px,${from.top - to.top}px) scale(${from.width / to.width})`;
      const d = decoy && oslot(decoy)?.getBoundingClientRect();
      // Mot den falska lådan och nästan ner i den, sedan en sväng till rätt låda
      const frames = d ? [{transform: start}, {transform: `translate(${d.left - to.left}px,${d.top - to.top + 10}px)`, offset: .55, easing: 'ease-in-out'},
          {transform: `translate(${d.left - to.left}px,${d.top - to.top - 26}px)`, offset: .72}, {transform: 'none'}]
        : [{transform: start}, {transform: `translate(${(from.left - to.left) / 2}px,${(from.top - to.top) / 2 - 40}px)`, offset: .5}, {transform: 'none'}];

// Fel färg: upp till sin egen låda, rött och skak, och tillbaka. Sedan en grön ledtråd på den rätta.
function orderMiss(btn, k, want){
  const o = S.ord;
  o.missed = true; o.decoy = null;
  const done = () => {
    if (S.ord !== o) return;
    o.away.delete(k); o.inflight--;
    // Ledtråden gäller färgen som står på tur nu, om den inte redan är vald
    const now = o.keys.find(x => !o.placed[x]);
    o.hint = now || null;
    syncChips();
    clearTimeout(o.hintT);
    o.hintT = setTimeout(() => { if (S.ord === o && o.hint === now) { o.hint = null; syncChips(); } }, HINT_MS);
    orderCheck(null);
  };
  o.inflight++; o.away.add(k);
  if (calmOrder()) { sfx.thud(); done(); return; }
  const from = btn.getBoundingClientRect();
  syncChips();
  const boxEl = oslot(k), to = boxEl.getBoundingClientRect();
  const f = document.createElement('b');
  f.className = 'ofloat'; f.setAttribute('aria-hidden', 'true');
  // Placeras på sidan, inte på skärmen, så att den följer med om man skrollar
  const O = ORDER_SETS[o.set];
  f.style.cssText = `left:${from.left + scrollX}px;top:${from.top + scrollY}px;width:${from.width}px;height:${from.height}px;${O.chip ? '' : swStyle(k)}`;
  if (O.chip) { f.classList.add('val'); f.innerHTML = O.chip(k, o); }
  document.body.appendChild(f);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2), dy = to.top + to.height / 2 - (from.top + from.height / 2), sc = to.width / from.width;
  const at = (x = 0) => `translate(${dx + x}px,${dy}px) scale(${sc})`;
  sfx.whoosh();
  f.animate?.([{transform: 'none'}, {transform: `translate(${dx / 2}px,${dy / 2 - 40}px)`, offset: .5}, {transform: at()}], {duration: FLY_MS, easing: 'cubic-bezier(.35,.1,.4,1)', fill: 'forwards'});
  setTimeout(() => {
    if (S.ord !== o) { f.remove(); return; }
    sfx.thud();
    boxEl.classList.add('bad', 'landnow');
    f.animate?.([{transform: at()}, {transform: at(-6)}, {transform: at(6)}, {transform: at(-4)}, {transform: at(3)}, {transform: at()}], {duration: 420, fill: 'forwards'});
    setTimeout(() => {
      boxEl.classList.remove('bad', 'landnow');

// När allt har landat: utan fel är frågan rätt, annars ett sista försök (eller fel om det var det sista)
function orderCheck(lastBox){
  const o = S.ord;
  if (o.inflight || !o.keys.every(x => o.placed[x])) return;
  if (!o.missed || o.round === 2) { S.lastTap = lastBox || oslot(o.keys[o.keys.length - 1]); finish(!o.missed); return; }
  const restart = () => {
    if (S.ord !== o) return;
    // Rutorna där färgerna satt, så att de kan flyga tillbaka till sina knappar
    const was = Object.fromEntries(o.keys.map(x => [x, oslot(x)?.querySelector('.osw')?.getBoundingClientRect()]));
    o.round = 2; o.placed = {}; o.landed = new Set(); o.missed = false; o.hint = null; o.reset = false;
    render();
    if (calmOrder()) return;
    sfx.whoosh();
    o.keys.forEach((x, i) => {
      const chip = ochip(x), r = was[x];
      if (!chip || !r || !chip.animate) return;
      const c = chip.getBoundingClientRect();
      chip.animate([{transform: `translate(${r.left - c.left}px,${r.top - c.top}px) scale(${r.width / c.width})`}, {transform: 'none'}],
        {duration: 600, delay: i * 45, easing: 'cubic-bezier(.3,.7,.4,1.1)', fill: 'backwards'});
    });
  };
  if (calmOrder()) { restart(); return; }
  o.reset = true;
  setTimeout(restart, 700);
}

function stdInfo(b){
  const k = nd(b), digits = b.slice(0, k).map(c => C[c].d).join('');
  const m3 = k === 2 ? +digits * 10 : +digits, mant = mantTxt(m3);
  const tol = tolOf(b), tb = `toleransbandet (${C[b[k + 1]].n.toLowerCase()}, ${fmtTol(tol)})`;
  const ser = TOL_SER[tol] || (tol <= 0.5 ? 'E192' : null);
  const inSet = seriesOf(m3);
  const inSer = ser === 'E192' ? inSet.includes('E96') : inSet.includes(ser);
  if (ser && inSer)
    return `<b>Standardvärde i ${ser}.</b> Så vet du det: ${tb} hör till ${ser}, och ${mant} finns i ${ser}${ser === 'E192' ? ', som innehåller alla E96-värden' : ''}.`;
  if (!inSet.length)
    return `<b>Inte ett standardvärde.</b> ${mant} finns inte i någon E-serie, oavsett tolerans.`;
  const lowest = inSet[0];
  if (ser && SER_ORDER.indexOf(lowest) < SER_ORDER.indexOf(ser)) {
    // E6- och E12-värden ingår i E24, och det är E24 som säljs med snävare toleranser
    const sold = inSet.includes('E24') ? 'E24' : lowest;
    return `<b>Standardvärde i ${sold}.</b> ${mant} finns i ${sold}. Egentligen hör ${tb} till ${ser}, där ${mant} inte finns, men ${sold}-värden säljs ofta även med snävare tolerans.`;
  }
  return `<b>Inte ett standardvärde med den här toleransen.</b> ${tb.charAt(0).toUpperCase() + tb.slice(1)} hör till ${ser}, och ${mant} finns inte i ${ser}. Det finns först i ${lowest}, som kräver snävare tolerans.`;
}
// Gränser med tillräckligt många siffror för att snäva toleranser inte ska avrundas bort (enhet efter det märkta värdet)
function fmtPrecise(x, ref){
  const [u, l] = ref >= 1e6 ? [1e6, 'MΩ'] : ref >= 1e3 ? [1e3, 'kΩ'] : [1, 'Ω'];
  return (x / u).toLocaleString('sv-SE', {maximumSignificantDigits: 5}) + ' ' + l;
}
// Facit: hur en mätning med multimeter kan se ut för just det här motståndet
function meterFB(v, tol, note){
  const mv = meterShown(meterRead(v, tol), v, tol);
  return `<div class="meterfb"><p>${note || 'Så här kan en mätning se ut:'}</p>${meterLcd(mv)}
    <p class="gnote">Toleransen ${fmtTol(tol)} tillåter allt från ${fmtPrecise(v * (1 - tol / 100), v)} till ${fmtPrecise(v * (1 + tol / 100), v)}, så mätvärdet ligger sällan exakt på det märkta värdet.</p></div>`;
}
