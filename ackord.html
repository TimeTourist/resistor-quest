<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ackordkartan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='3' fill='%231c1a22'/%3E%3Cg fill='%23f7f2e6'%3E%3Crect x='4' y='6' width='5.5' height='20' rx='1'/%3E%3Crect x='10.5' y='6' width='5.5' height='20' rx='1'/%3E%3Crect x='16' y='6' width='5.5' height='20' rx='1'/%3E%3Crect x='22.5' y='6' width='5.5' height='20' rx='1'/%3E%3C/g%3E%3Crect x='4' y='6' width='5.5' height='20' rx='1' fill='%23e3a23b'/%3E%3Crect x='16' y='6' width='5.5' height='20' rx='1' fill='%23e3a23b'/%3E%3Cg fill='%231c1a22'%3E%3Crect x='8' y='6' width='4' height='12'/%3E%3Crect x='14.5' y='6' width='4' height='12'/%3E%3Crect x='26.5' y='6' width='3' height='12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Samma spelform som Färgkoden: rutnät av ämneskort som zoomas upp till ett spelkort.
   Ackordkartans värld: notlinjer i bakgrunden, elfenben och ebenholts, ackord som lyser i bärnsten. */
:root{
  --bg:#e7e6ec;--staff:rgba(60,48,90,.09);--surface:#fff;--ink:#211d2b;--muted:#5d5869;--line:#cdc9d6;
  --accent:#6b3fa0;--accent-ink:#fff;--ok:#24803a;--ok-bg:#e3f3e6;--bad:#b83227;--bad-bg:#f8e4e1;--tip-bg:#fbefcf;
  --ivory:#fbf8f0;--ivory-line:#a79f8d;--ebony:#1c1a22;--chord:#e3a23b;--chord-soft:#f6dcae;--keyname:#3a3326;
  --fog:rgba(220,218,228,.92);--fresh:#8fe25f;--ripe:#2a9b48;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15131b;--staff:rgba(170,150,220,.07);--surface:#1f1c27;--ink:#ebe8f2;--muted:#a49eb2;--line:#3a3546;
    --accent:#b48be6;--accent-ink:#17121f;--ok:#6fcf86;--ok-bg:#183222;--bad:#ef8a7e;--bad-bg:#3a1d1a;--tip-bg:#3a3117;
    --ivory:#ece6d6;--ivory-line:#7d7563;--ebony:#0c0b10;--chord:#e9a24a;--chord-soft:#c9a874;--keyname:#2a2418;--fog:rgba(40,36,52,.92);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15131b;--staff:rgba(170,150,220,.07);--surface:#1f1c27;--ink:#ebe8f2;--muted:#a49eb2;--line:#3a3546;
  --accent:#b48be6;--accent-ink:#17121f;--ok:#6fcf86;--ok-bg:#183222;--bad:#ef8a7e;--bad-bg:#3a1d1a;--tip-bg:#3a3117;
  --ivory:#ece6d6;--ivory-line:#7d7563;--ebony:#0c0b10;--chord:#e9a24a;--chord-soft:#c9a874;--keyname:#2a2418;--fog:rgba(40,36,52,.92);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);background-color:var(--bg);
  /* Fem notlinjer, sedan ett mellanrum */
  background-image:repeating-linear-gradient(180deg,transparent 0 10px,var(--staff) 10px 11px,transparent 11px 20px,var(--staff) 20px 21px,transparent 21px 30px,var(--staff) 30px 31px,transparent 31px 40px,var(--staff) 40px 41px,transparent 41px 50px,var(--staff) 50px 51px,transparent 51px 96px);
  font:16px/1.5 var(--text)}
html,body{overflow-x:clip}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.home{align-self:flex-start;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none}
.home:hover{color:var(--accent)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1;margin:0;display:flex;align-items:center;gap:10px}
.brand svg{width:1.1em;height:auto}
.soundbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.soundbtn svg{width:22px;height:22px}
.soundbtn[aria-pressed="false"]{color:var(--muted)}
.lead{margin:10px 0 20px;color:var(--muted);max-width:60ch}
.lead[hidden],.grid[hidden]{display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Startsidan: åtta minikort */
.grid{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:190px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
  border:2px solid var(--c);border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.tpat{position:absolute;inset:0;background-image:var(--pat);pointer-events:none}
.thead{position:relative;display:flex;align-items:center;gap:10px}
.ticon{flex:none;width:40px;height:40px;border-radius:11px;background:var(--c);color:var(--ci);display:grid;place-items:center}
.ticon svg{width:28px;height:28px}
.tname{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.tline{position:relative;display:block;color:var(--muted);font-size:.86rem;line-height:1.35}
.tfoot{position:relative;margin-top:auto;display:grid;gap:5px}
.tstate{font-size:.8rem;font-weight:600}
.tchip{display:inline-block;justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--c);color:var(--ci)}
.gb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gb .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:12px}
.gb i{display:block;border-radius:2px;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);background:var(--surface)}
.gb i.on{background:var(--fresh);border-color:#6cc43c}
.gb i.full{background:var(--ripe);border-color:var(--ripe)}
.gb .cur .cells{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
.tile.locked{border-color:var(--line);background:var(--surface)}
.locked .ticon{background:var(--line);color:var(--muted)}
.locked .thead,.locked .tline{opacity:.5}
.soonchip{position:relative;z-index:3;align-self:flex-start;margin-top:auto;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--surface)}
.fog{position:absolute;inset:-30%;pointer-events:none;
  background:radial-gradient(closest-side at 30% 35%,var(--fog),transparent),radial-gradient(closest-side at 70% 65%,var(--fog),transparent),radial-gradient(closest-side at 50% 50%,var(--fog),transparent 120%);
  opacity:.8;transition:opacity 1s ease}
@media (prefers-reduced-motion:no-preference){.fog{animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(8%,-6%) scale(1.08)}}}
.chains{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:transform .9s ease-in .25s,opacity .9s ease-in .25s}
.padlock{position:absolute;left:50%;top:50%;width:56px;margin:-34px 0 0 -28px;transition:transform .8s cubic-bezier(.5,0,.9,.6) .45s,opacity .8s .45s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.padlock .shackle{transition:transform .35s ease .1s}
@media (prefers-reduced-motion:no-preference){.tile.nope{animation:nope .4s ease-in-out}@keyframes nope{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}}
.tile.opening .shackle{transform:translateY(-12px)}
.tile.opening .padlock{transform:translateY(160px) rotate(25deg);opacity:0}
.tile.opening .chains{transform:translateY(60px);opacity:0}
.tile.opening .fog{opacity:0}
.tile.fresh{animation:lightup 1.4s ease-out}
@media (prefers-reduced-motion:reduce){.tile.fresh{animation:none}}
@keyframes lightup{0%{filter:saturate(0) brightness(1.1)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 30%,transparent)}100%{filter:none}}
.newflag{position:absolute;top:10px;right:10px;font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;background:var(--c);color:var(--ci);border-radius:999px;padding:2px 10px}
.tile.done{border-color:#b8860b;color:#3a2a00;background:linear-gradient(150deg,#fff1b0,#e8b923 55%,#c8961a)}
.done .tline{color:#5a4300}
.done .ticon{background:#3a2a00;color:#f2c94c}
.done .tchip{background:#3a2a00;color:#f2c94c}
.tile.exam{border:0;color:#ffe8d2;background:radial-gradient(120% 95% at 70% 115%,#ff9a3c,#d9381e 42%,#2a1712 86%)}
.tile.exam .tline{color:#ffd6b0}
.tile.exam .ticon{background:rgba(0,0,0,.35);color:#ffb347}
.tile.exam.soon{filter:saturate(.35) brightness(.85)}
.tile.exam .soonchip{background:#ffe8d2;color:#2a1712}
.keyghost{position:fixed;z-index:100;width:70px;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.keyghost svg,.inkey svg{display:block;width:100%;height:auto}
.inkey{position:absolute;left:calc(50% - 58px);top:calc(50% - 4px);width:62px;z-index:3;pointer-events:none;transform-origin:92% 50%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));--kin:6px;--push:11px;clip-path:inset(-30px var(--kin) -30px -30px)}
.inkey.arriving{visibility:hidden}
@media (prefers-reduced-motion:no-preference){
  .inkey{animation:keyrattle 1.6s ease-in-out infinite}
  @keyframes keyrattle{0%,55%,100%{transform:none}60%{transform:rotate(-8deg)}65%{transform:rotate(7deg)}70%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
  .tile.turning .inkey{animation:pushturn .75s ease-in forwards}
  @keyframes pushturn{0%{transform:none;clip-path:inset(-30px var(--kin) -30px -30px)}40%,55%{transform:translateX(var(--push));clip-path:inset(-30px calc(var(--kin) + var(--push)) -30px -30px)}100%{transform:translateX(var(--push)) rotateX(80deg);clip-path:inset(-30px calc(var(--kin) + var(--push)) -30px -30px)}}
}
.tile.haskey{box-shadow:0 0 0 3px var(--c),0 0 26px color-mix(in srgb,var(--c) 60%,transparent)}
.tile.haskey .kh{fill:var(--c)}
.tile.opening .inkey{opacity:0;transition:opacity .3s .3s}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:719px){
  .tile{min-height:170px;padding:12px;gap:6px;border-radius:14px}
  .ticon{width:34px;height:34px}.ticon svg{width:24px;height:24px}
  .tname{font-size:1.3rem}
  .tline{font-size:.8rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .padlock{width:46px;margin:-28px 0 0 -23px}
  .inkey{left:calc(50% - 48px);width:52px;--kin:4px;--push:9px}
}
@media (max-width:379px){.grid{grid-template-columns:minmax(0,1fr)}.tile{min-height:0}}

/* Spelkortet */
.play{container-type:inline-size;position:relative;margin-top:4px;display:flex;flex-direction:column;overflow:hidden;border:3px solid var(--c);border-radius:18px;
  background:color-mix(in srgb,var(--c) 9%,var(--surface));box-shadow:0 20px 50px rgba(0,0,0,.25)}
.play[hidden]{display:none}
.phead{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--c);color:var(--ci)}
.phead[hidden],.gbar[hidden]{display:none}
.phead .ticon{background:rgba(0,0,0,.18);color:var(--ci)}
.pname{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,6cqi,1.8rem);line-height:1;min-width:0;overflow-wrap:anywhere}
.pmode{font-family:var(--display);font-weight:600;font-size:1.2rem;opacity:.85}
.closebtn{margin-left:auto;display:flex;align-items:center;gap:6px;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font:inherit;font-weight:600;font-size:.88rem}
.closebtn svg{width:20px;height:20px}
.play .pbody{position:relative;max-width:720px;width:100%;margin:0 auto;padding:12px 16px 20px}
.play.goldplay{border-color:#b8860b}
.goldplay .phead{background:linear-gradient(120deg,#e8b923,#b8860b);color:#3a2a00}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
#q{position:relative}

/* Omslaget */
.play.cover{border-width:6px}
.play.cover #q{background:transparent;border:0;padding:6px 4px 4px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cover .kb{max-width:460px;margin:8px auto 0}
.cname{font-family:var(--display);font-weight:700;font-size:clamp(2rem,10cqi,3.6rem);line-height:.95;margin:8px 0 6px;display:flex;align-items:center;gap:12px;min-width:0;overflow-wrap:anywhere}
.cname .ticon{width:52px;height:52px;border-radius:13px}.cname .ticon svg{width:36px;height:36px}
.cline{margin:0;color:var(--muted);font-size:1.05rem;max-width:52ch}
.unlock{margin-top:auto;padding-top:18px}
.unlock .rule{height:0;border-top:2px dashed var(--c);margin-bottom:14px}
.ulab{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.ulab svg{width:20px;height:20px;color:var(--c)}
.kickq{font-weight:700;font-size:1.15rem;margin:6px 0 10px}
.kickopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kopt{min-width:0;overflow-wrap:anywhere;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 10px;min-height:60px;cursor:pointer;text-align:center}
.kopt:hover{border-color:var(--c)}
.kopt.bad{border-color:var(--bad);background:var(--bad-bg);cursor:default;opacity:.75}
.kopt.ok{border-color:var(--ok);background:var(--ok-bg)}
.xbtn{position:absolute;top:4px;right:4px;z-index:2;width:40px;height:40px;border-radius:50%;border:2px solid var(--c);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.xbtn svg{width:20px;height:20px}
@media (prefers-reduced-motion:no-preference){.kickopts.shake{animation:shake .45s ease-in-out}}

/* Nyckeln på spelkortet */
.keywin{margin:auto;text-align:center;display:grid;justify-items:center;gap:6px}
.keywin svg{width:180px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
@media (prefers-reduced-motion:no-preference){.keywin svg{animation:keyin .8s cubic-bezier(.3,1.6,.5,1) both}@keyframes keyin{from{transform:scale(.2) rotate(-90deg);opacity:0}}}
.keywin h3{font-family:var(--display);font-size:2rem;line-height:1.05;margin:8px 0 0;text-wrap:balance}
.keywin p{margin:0;color:var(--muted)}

/* Frågan */
.kindtag{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--bg);color:var(--muted)}
.kind-keys .kindtag{background:var(--chord);color:var(--keyname)}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.prompt{font-size:1.1rem;margin:0;padding-top:6px;font-weight:500}
.replay{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 9px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.replay svg{width:16px;height:16px}
.replay:hover{border-color:var(--accent)}
.big{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.05;margin:0 0 6px}
.opts{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer;min-height:56px;min-width:0;overflow-wrap:anywhere;
  font-family:var(--display);font-size:1.45rem;line-height:1.15}
.opt.txt{font-family:var(--text);font-size:1rem}
.opt:hover:not(:disabled):not([aria-disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.chosen{box-shadow:inset 0 0 0 3px var(--accent)}
.opt:disabled,.opt[aria-disabled]{cursor:default}
.primary{margin-top:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:12px 22px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.submitrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.submitrow .count{color:var(--muted);font-size:.95rem;margin-top:14px}
.lesson{margin:14px 0 0;border-radius:10px;padding:10px 14px;line-height:1.45;background:var(--bad-bg)}
.cheat{position:relative;box-shadow:inset 0 0 0 3px var(--ok)}
.cheat::after{content:'➜';position:absolute;left:6px;top:3px;color:var(--ok);font:700 1rem/1 system-ui,sans-serif}
.cheatline{color:var(--ok);font-weight:700;font-size:.95rem;margin:10px 0 0}

/* Klaviaturen */
.kb{margin:6px 0 0}
.kb svg{display:block;width:100%;height:auto;max-width:600px;margin:0 auto;overflow:visible;touch-action:manipulation}
.k .kr{stroke:var(--ivory-line);stroke-width:1}
.k.w .kr{fill:var(--ivory)}
.k.b .kr{fill:var(--ebony);stroke:var(--ebony)}
.k[data-key]{cursor:pointer}
.k[data-key]:focus{outline:none}
.k[data-key]:focus-visible .kr{stroke:var(--accent);stroke-width:3}
.k.w[data-key]:hover .kr{fill:color-mix(in srgb,var(--accent) 12%,var(--ivory))}
.k.b[data-key]:hover .kr{fill:color-mix(in srgb,var(--accent) 35%,var(--ebony))}
.k.sel .kr{fill:var(--accent)!important;stroke:var(--accent)}
.lit{pointer-events:none}
.lit.acc{fill:var(--chord)}
.lit.step{fill:var(--chord-soft)}
.lit.ok{fill:var(--ok)}
.lit.bad{fill:var(--bad)}
.lit.ghost{fill:var(--chord);opacity:.35}
.kn{font:700 13px var(--text);pointer-events:none}
.kn.onw{fill:var(--keyname)}
.kn.onb{fill:#fff;font-size:10.5px}
.k.sel~.kn{fill:#fff}
.arc path{stroke-width:2.5;stroke-linecap:round}
.arc text{font:700 13px var(--text);text-anchor:middle}
.arc.acc path{stroke:var(--accent)}.arc.acc circle,.arc.acc text{fill:var(--accent)}
.arc.ok path{stroke:var(--ok)}.arc.ok circle,.arc.ok text{fill:var(--ok)}
.arc.bad path{stroke:var(--bad)}.arc.bad circle,.arc.bad text{fill:var(--bad)}
.under{font:600 12px var(--text);fill:var(--muted)}
.under.ok{fill:var(--ok)}.under.bad{fill:var(--bad)}
.cheatmark{fill:var(--ok)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}
.chain span{padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:.9rem}
.chain span.now{border-color:var(--chord);background:var(--chord-soft);color:var(--keyname)}
.chain span.nx{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chain i{font-style:normal;color:var(--muted)}
.why{margin:0 0 6px}
.tryline{margin:6px 0 0;text-align:center;color:var(--muted);font-size:.85rem}
.animnote{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--bg);line-height:1.45}
.animnote b{font-family:var(--display);font-size:1.25rem}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}

<script>
// ===================== Musikteori =====================
// En ton är en bokstav (0–6, C–B) och ett förtecken (−1 ♭, 0, +1 ♯). B är tonen under C (på svenska ofta H).
const LETTERS = ['C','D','E','F','G','A','B'], NAT = [0, 2, 4, 5, 7, 9, 11];
const ACC = {'-2':'𝄫', '-1':'♭', '0':'', '1':'♯', '2':'𝄪'};
const N = s => ({l: LETTERS.indexOf(s[0]), a: s.length > 1 ? (s[1] === '♯' ? 1 : -1) : 0});
const pcOf = n => ((NAT[n.l] + n.a) % 12 + 12) % 12;
const nName = n => LETTERS[n.l] + ACC[n.a];
// Tonen semis halvtoner och steps bokstäver upp från n, stavad efter bokstaven
function upN(n, semis, steps){
  const l = (n.l + steps) % 7, t = (pcOf(n) + semis) % 12;
  let a = ((t - NAT[l]) % 12 + 12) % 12;
  if (a > 6) a -= 12;
  return {l, a};
}
// Treklangernas sorter: halvtoner och bokstavssteg från grundtonen, och vad tonerna kallas
const QUAL = {
  maj: {n:'dur', suf:'', iv:[[0,0],[4,2],[7,4]], roles:['grundton','ters','kvint']},
  min: {n:'moll', suf:'m', iv:[[0,0],[3,2],[7,4]], roles:['grundton','ters','kvint']},
  dim: {n:'förminskat', suf:'dim', iv:[[0,0],[3,2],[6,4]], roles:['grundton','ters','kvint']},
  aug: {n:'överstigande', suf:'aug', iv:[[0,0],[4,2],[8,4]], roles:['grundton','ters','kvint']},
  sus2: {n:'sus2', suf:'sus2', iv:[[0,0],[2,1],[7,4]], roles:['grundton','sekund','kvint']},
  sus4: {n:'sus4', suf:'sus4', iv:[[0,0],[5,3],[7,4]], roles:['grundton','kvart','kvint']},
  // Fyrklangerna
  maj7: {n:'maj7', suf:'maj7', iv:[[0,0],[4,2],[7,4],[11,6]], roles:['grundton','ters','kvint','sept']},
  dom7: {n:'sept (dominant)', suf:'7', iv:[[0,0],[4,2],[7,4],[10,6]], roles:['grundton','ters','kvint','sept']},
  min7: {n:'moll sept', suf:'m7', iv:[[0,0],[3,2],[7,4],[10,6]], roles:['grundton','ters','kvint','sept']},
  hdim: {n:'halvförminskat', suf:'m7♭5', iv:[[0,0],[3,2],[6,4],[10,6]], roles:['grundton','ters','kvint','sept']},
  add9: {n:'add9', suf:'add9', iv:[[0,0],[4,2],[7,4],[14,1]], roles:['grundton','ters','kvint','nia']}
};
const Q7 = ['maj7','dom7','min7','hdim','add9'];
const QORDER = ['maj','min','dim','aug','sus2','sus4'];
const spell = (root, q) => QUAL[q].iv.map(([s, st]) => upN(root, s, st));
const chordName = (root, q) => nName(root) + QUAL[q].suf;
const spellTxt = (root, q) => spell(root, q).map(nName).join(' ');
// Stavningen, eller null om den skulle kräva dubbelkors eller dubbelbe
const spellOk = (root, q) => noDouble(root, q) ? spellTxt(root, q) : null;
const ROOT_NAMES = ['C','C♯','D♭','D','D♯','E♭','E','F','F♯','G♭','G','G♯','A♭','A','A♯','B♭','B'];
// Grundtonerna som brukar användas: D♭-dur men C♯-moll, och så vidare
const COMMON0 = {maj:['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], min:['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B']};
const noDouble = (root, q) => spell(root, q).every(n => Math.abs(n.a) < 2);
const COMMON = {...COMMON0, maj7: COMMON0.maj, dom7: COMMON0.maj, min7: COMMON0.min, hdim: COMMON0.min, add9: COMMON0.maj.filter(r => pcOf(N(r)) <= 9)};
const rootsFor = q => (COMMON[q] || ROOT_NAMES).filter(r => noDouble(N(r), q));
const WHITE_ROOTS = ['C','D','E','F','G','A','B'];
// Klaviaturen: två oktaver, C4 (60) till B5 (83)
const LO = 60, HI = 83;
const KEYS = Array.from({length: HI - LO + 1}, (_, i) => LO + i);
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
const WHITES = KEYS.filter(m => !isBlack(m)), BLACKS = KEYS.filter(isBlack);
const rootMidi = n => LO + pcOf(n);
// En ton som hamnar över klaviaturen läggs en oktav ner
const voicing = (root, q) => QUAL[q].iv.map(([s]) => rootMidi(root) + s).map(m => m > HI ? m - 12 : m);
const pcSet = ms => [...new Set(ms.map(m => ((m % 12) + 12) % 12))].sort((a, b) => a - b);
const samePcs = (a, b) => pcSet(a).join() === pcSet(b).join();
const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'], FLAT = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const pcName = m => { const p = ((m % 12) + 12) % 12; return SHARP[p] === FLAT[p] ? SHARP[p] : `${SHARP[p]}/${FLAT[p]}`; };
const pairName = m => { const p = ((m % 12) + 12) % 12; return `${SHARP[p]} / ${FLAT[p]}`; };
const keyLabel = m => `${pcName(m).replace('/', ' eller ')}, oktav ${Math.floor(m / 12) - 1}`;
// Skalorna: halvtoner från grundtonen per skalsteg. Skalsteg k är bokstaven k steg upp.
const MODE = {maj: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 8, 10]};
const scale = (tonic, mode = 'maj') => MODE[mode].map((s, k) => upN(tonic, s, k));
const scaleMidi = (tonic, mode = 'maj') => MODE[mode].map(s => rootMidi(tonic) + s);
// Förtecknen: antal ♯ (positivt) eller ♭ (negativt)
const accCount = (tonic, mode = 'maj') => scale(tonic, mode).reduce((s, n) => s + n.a, 0);
const accTxt = n => n === 0 ? 'Inga' : n > 0 ? `${n} ♯` : `${-n} ♭`;
const MAJ_KEYS = ['C','G','D','A','E','B','F','B♭','E♭','A♭','D♭'];
const MIN_KEYS = ['A','E','B','F♯','C♯','G♯','D','G','C','F','B♭'];
// Kvintcirkeln medsols från C. Plats 6 är F♯ eller G♭.
const CIRCLE = ['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];
const CIRCLE_MIN = ['Am','Em','Bm','F♯m','C♯m','G♯m','E♭m','B♭m','Fm','Cm','Gm','Dm'];
const circleIdx = name => CIRCLE.indexOf(name);
const circleAcc = i => i <= 6 ? i : i - 12;
// Stegen i dur: sort och funktion (tonika, subdominant, dominant)
const ROMAN = ['I','ii','iii','IV','V','vi','vii°'], DQ = ['maj','min','min','maj','maj','min','dim'];
const FUNC = ['T','S','T','S','D','T','D'], FUNC_NAME = {T:'Tonika', S:'Subdominant', D:'Dominant'}, FUNC_MAIN = {T:0, S:3, D:4};
// Ackordet på steg d: skalans toner d, d+2 och d+4. Det läggs en oktav ner om det inte ryms.
function diat(tonic, d){
  const base = scaleMidi(tonic), root = scale(tonic)[d], q = DQ[d];
  let ms = [d, d + 2, d + 4].map(k => base[k % 7] + 12 * Math.floor(k / 7));
  if (ms[2] > HI) ms = ms.map(m => m - 12);
  return {root, q, roman: ROMAN[d], name: chordName(root, q), ms, names: spell(root, q).map(nName)};
}
// Ackorden i en durtonart som tonklass och sort, för att se vilka tonarter som rymmer en följd
const diatSet = pc => DQ.map((q, d) => `${(pc + MODE.maj[d]) % 12}${q}`);
const ord = n => n + (n <= 2 ? ':a' : ':e');

// ===================== Allmänt =====================
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Rätt svar och tre andra, utan dubbletter
function four(right, others){
  const out = [right];
  for (const x of others) { if (out.length === 4) break; if (x && !out.includes(x)) out.push(x); }
  return shuffle(out);
}
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===================== Klaviaturen =====================
// En SVG-sträng. lit: {midi: 'acc'|'ok'|'bad'|'step'|{cls, at}}, names: {midi: text|{text, at}},
// arcs: [{a, b, text, at, cls}], under: [{m, text, at, cls}], tap: tangenterna är knappar, sel: valda tangenter.
const KW = 30, KH = 120, BW = 18, BH = 76;
function keyX(m){
  const o = Math.floor((m - LO) / 12), p = ((m % 12) + 12) % 12;
  return isBlack(m) ? o * 7 * KW + (NAT.indexOf(p - 1) + 1) * KW : o * 7 * KW + NAT.indexOf(p) * KW + KW / 2;
}
// Etiketter vid klaviaturens kanter hänger inåt i stället för utanför
const edge = m => ` text-anchor="${keyX(m) < 45 ? 'start' : keyX(m) > WHITES.length * KW - 45 ? 'end' : 'middle'}"`;
const dl = at => at != null ? ` style="animation-delay:${at.toFixed(2)}s"` : '';
const mkc = at => at != null ? ' mk' : '';
function kbd(o = {}){
  const lit = o.lit || {}, names = o.names || {}, sel = o.sel || [], cheat = o.cheat || [];
  const key = m => {
    const b = isBlack(m), x = keyX(m) - (b ? BW / 2 : KW / 2), w = b ? BW : KW - 1, h = b ? BH : KH;

// Ett tryck på fel tangenter i en skala eller ett ackord: de blir röda
const badKeys = (pick, right) => Object.fromEntries((pick || []).filter(m => !pcSet(right).includes(((m % 12) + 12) % 12)).map(m => [m, 'bad']));
const scaleKeys = n => MAJ_KEYS.filter(k => Math.abs(accCount(N(k))) <= n);

      anim(pick){ const W = scaleWalk(tonic, 'maj', T0, hot), Y = accWhy(opts[pick[0]], n), path = circlePath(circleIdx(nName(tonic))), t2 = W.end + .3;
        return {kb:{lit:W.lit, names:W.names, arcs:W.arcs},
          note:`<span class="mk"${dl(W.end)}>${accs.length ? `${majName(tonic)} har <b>${accs.join(' ')}</b>: ${right}.` : 'C-dur har inga förtecken.'}</span>` +
            `${circleSvg(path, t2, .25, true, Y.bad)}<span class="mk"${dl(t2 + path.length * .25)}>${Y.text}</span>`,

  // Mästare
  [{id:'tonart-cirkel', make(){
    const i = rnd([1, 2, 3, 4, 5, 7, 8, 9, 10, 11]), n = circleAcc(i), tonic = N(CIRCLE[i]), right = majName(tonic);
    const opts = four(right, shuffle([(i + 1) % 12, (i + 11) % 12, (12 - i) % 12, (i + 2) % 12, (i + 10) % 12].filter(k => k !== 6 && k !== i).map(k => majName(N(CIRCLE[k])))));

        return {kb:{lit:layer(badKeys(pick, ms), W.lit), names:W.names, arcs:W.arcs}, note:`<p class="why">${scaleWhy(pick, ms)}</p>${W.chips}<span class="mk"${dl(W.end)}>Moll från ${nName(tonic)}: ${PATTERN.min}.</span>`, sound:W.sound, total:W.end + .6}; }};

// Fel alternativ för ett steg: samma grundton i en annan sort, och grannstegens ackord
const stepOpts = (tonic, d) => { const D = diat(tonic, d);
  return four(D.name, shuffle([...sameRoot(D.root, ['maj','min','dim'].filter(q => q !== D.q)), diat(tonic, (d + 1) % 7).name, diat(tonic, (d + 6) % 7).name]).filter(okName)); };
const romanOpts = d => four(ROMAN[d], shuffle(ROMAN.filter((_, k) => k !== d)));
function stepChordQ(keys){
  const tonic = N(rnd(keys)), d = Math.floor(Math.random() * 7), D = diat(tonic, d), opts = stepOpts(tonic, d), K = majName(tonic);
  return {kind:'mc', prompt:`I ${K}: vilket ackord är ${D.roman}?`, show:{lit:{[rootMidi(tonic)]:'acc'}, names:{[rootMidi(tonic)]:nName(tonic)}}, opts, right: opts.indexOf(D.name),
    wrong:`Räkna skalan från ${nName(tonic)}: ${D.roman} är ${nName(D.root)}, och tonerna ${D.names.join(' ')} ur skalan ger ${D.name}.`,
    anim(){ const A = stepWalk(tonic, d); return {...A, note:`<span class="mk"${dl(A.end)}>${D.roman} i ${K} = <b>${D.name}</b> (${QUAL[D.q].n}).</span>`}; }};
}
const PROGS = [[0, 4, 5, 3], [0, 3, 4, 0], [1, 4, 0], [5, 3, 0, 4], [0, 5, 3, 4], [0, 5, 1, 4]];
const progTxt = (tonic, p) => p.map(d => diat(tonic, d).name).join(' ');
const Q_STEG = [
  // Nykomling
  [{id:'steg-c-dur', make(){
    const tonic = N('C'), d = Math.floor(Math.random() * 7), D = diat(tonic, d), opts = romanOpts(d);
    const lit = {}, names = {}; D.ms.forEach((m, i) => { lit[m] = 'acc'; names[m] = D.names[i]; });
    return {kind:'mc', prompt:'I C-dur: vilket steg är det här ackordet?', show:{lit, names}, sound:[{chord:D.ms}], opts, right: opts.indexOf(D.roman),
      wrong:`${D.name} har grundtonen ${nName(D.root)}, den ${ord(d + 1)} tonen i C-dur: steg ${D.roman}.`,
      anim(){ const A = stepWalk(tonic, d); return {...A, note:`<span class="mk"${dl(A.end)}>C D E F G A B: ${nName(D.root)} är ${ord(d + 1)} tonen, och ${D.name} är <b>${D.roman}</b>. Stora siffror är dur, små är moll, ° är förminskat.</span>`}; }};
  }}],
  // Lärling
  [{id:'steg-ackord-latt', make(){ return stepChordQ(['C','G','F']); }}],
  // Gesäll
  [{id:'steg-ackord', make(){ return stepChordQ(MAJ_KEYS); }},
  {id:'steg-ta', make(){
    const tonic = N(rnd(MAJ_KEYS)), d = Math.floor(Math.random() * 7), D = diat(tonic, d), K = majName(tonic);
    return {kind:'keys', need:3, prompt:`I ${K}: ta ${D.roman}.`, show:{}, check: sel => samePcs(sel, D.ms), answer: D.ms,
      wrong:`${D.roman} i ${K} är ${D.name}: ${D.names.join(' ')}.`,
      anim(pick){ const A = stepWalk(tonic, d); return {...A, kb:{...A.kb, lit:layer(badKeys(pick, D.ms), A.kb.lit)}, note:`<span class="mk"${dl(A.end)}>${D.roman} i ${K} = <b>${D.name}</b>.</span>`}; }};
  }}],
  // Mästare
  [{id:'steg-vilket', make(){
    const tonic = N(rnd(MAJ_KEYS)), d = Math.floor(Math.random() * 7), D = diat(tonic, d), opts = romanOpts(d), K = majName(tonic);
    return {kind:'mc', prompt:`${D.name} i ${K}: vilket steg?`, show:chordShow(D), opts, right: opts.indexOf(D.roman),
      wrong:`Räkna från ${nName(tonic)}: ${nName(D.root)} är ${ord(d + 1)} tonen i ${K}, så ${D.name} är ${D.roman}.`,
      anim(){ const A = stepWalk(tonic, d); return {...A, note:`<span class="mk"${dl(A.end)}>${D.name} = <b>${D.roman}</b> i ${K}.</span>`}; }};
  }},
  {id:'steg-funktion', make(){

    D.ms.forEach((m, i) => { lit[m] = 'acc'; names[m] = D.names[i]; });
    return {kind:'mc', prompt:`I ${K}: vilken funktion har ${D.name} (${D.roman})?`, show:{lit, names}, sound:[{chord:D.ms}], opts, right: opts.indexOf(FUNC_NAME[f]), txt:true,
      wrong:`${D.roman} hör till ${FUNC_NAME[f].toLowerCase()}gruppen. Den delar toner med ${diat(tonic, FUNC_MAIN[f]).name}.`,
      anim(){ const M = diat(tonic, FUNC_MAIN[f]), same = M.name === D.name, t2 = T0 + 1.2, mlit = {}, clit = {}, nm = {};
        M.ms.forEach((m, i) => { mlit[m] = {cls:'step', at:T0}; nm[m] = {text:M.names[i], at:T0}; });
        D.ms.forEach((m, i) => { clit[m] = {cls:'ok', at:same ? T0 : t2}; nm[m] = {text:D.names[i], at:same ? T0 : t2}; });
        const shared = same ? [] : D.ms.filter(m => pcSet(M.ms).includes(m % 12)).map(m => D.names[D.ms.indexOf(m)]);
        const under = same ? [] : [{m:M.ms[0], text:M.roman, at:T0}, {m:D.ms[0], text:D.roman, at:t2, cls:'ok', row:1}];
        const rows = [['T', 'I iii vi', 'hemma, vila'], ['S', 'ii IV', 'på väg bort'], ['D', 'V vii°', 'vill hem till I']];
        const tab = `<table class="qtab">${rows.map(([k, s, w]) => `<tr class="${k === f ? 'hit mk' : ''}"${k === f ? dl(t2 + .4) : ''}><td>${FUNC_NAME[k]}</td><td>${s}</td><td>${w}</td></tr>`).join('')}</table>`;
        const share = shared.length ? `<span class="mk"${dl(t2 + .4)}>${D.name} och ${M.name} delar ${shared.join(' och ')}.</span>` : '';

          sound: same ? [{chord:D.ms, at:T0}] : [{chord:M.ms, at:T0}, {chord:D.ms, at:t2}], total:t2 + 1.4}; }};
  }}],
  // Stormästare
  [{id:'steg-transponera', make(){
    const p = rnd(PROGS), tonic = N(rnd(MAJ_KEYS.filter(k => k !== 'C'))), right = progTxt(tonic, p), C = N('C');
    const wrongQ = p.map(d => { const D = diat(tonic, d); return chordName(D.root, D.q === 'maj' ? 'min' : 'maj'); }).join(' ');
    const opts = four(right, shuffle([progTxt(upN(tonic, 7, 4), p), progTxt(upN(tonic, 5, 3), p), wrongQ, progTxt(upN(tonic, 2, 1), p)].filter(s => !/𝄪|𝄫|E♯|B♯|C♭|F♭/.test(s))));
    const K = majName(tonic), romans = p.map(d => ROMAN[d]).join('–');
    return {kind:'mc', prompt:`${romans} i C-dur är ${progTxt(C, p)}. Vad blir det i ${K}?`, show:rootShow(tonic),
      sound:p.map((d, i) => ({chord:diat(C, d).ms, at:i * .8})), opts, right: opts.indexOf(right), txt:true,
      wrong:`Samma steg i ${K}: ${p.map(d => `${ROMAN[d]} = ${diat(tonic, d).name}`).join(', ')}.`,
      anim(){ const S0 = stepScale(tonic), t2 = T0 + .4;
        const cell = (s, i, at) => `<td class="mk"${dl(at)}>${s}</td>`;
        const tab = `<table class="qtab"><tr><td></td>${p.map(d => `<td><b>${ROMAN[d]}</b></td>`).join('')}</tr>
          <tr><td>C-dur</td>${p.map(d => `<td>${diat(C, d).name}</td>`).join('')}</tr>
          <tr class="hit"><td>${K}</td>${p.map((d, i) => cell(diat(tonic, d).name, i, t2 + i * .8)).join('')}</tr></table>`;
        return {kb:{lit:S0.lit, names:S0.names, under:S0.under}, note:tab,
          sound:p.map((d, i) => ({chord:diat(tonic, d).ms, at:t2 + i * .8})), total:t2 + p.length * .8 + .6}; }};
  }},
  {id:'steg-tonart', make(){
    // Tre ackord som bara ryms i en enda durtonart

    for (let tries = 0; tries < 50; tries++) {
      tonic = N(rnd(MAJ_KEYS)); ds = shuffle([0, 1, 2, 3, 4, 5]).slice(0, 3);
      const want = ds.map(d => diatSet(pcOf(tonic))[d]);
      if (Array.from({length: 12}, (_, pc) => pc).filter(pc => want.every(x => diatSet(pc).includes(x))).length === 1) break;
    }
    const names = ds.map(d => diat(tonic, d).name), right = majName(tonic), i = circleIdx(nName(tonic));
    const opts = four(right, shuffle([(i + 1) % 12, (i + 11) % 12, (i + 2) % 12, (i + 10) % 12, (i + 3) % 12].filter(k => k !== 6).map(k => majName(N(CIRCLE[k])))));
    return {kind:'mc', prompt:`${names.slice(0, 2).join(', ')} och ${names[2]}: vilken durtonart hör de hemma i?`, show:(() => { const lit = {}, names = {}; ds.forEach(d => { const C = chordShow(diat(tonic, d)); Object.assign(lit, C.lit); Object.assign(names, C.names); }); return {lit, names}; })(),
      sound:ds.map((d, k) => ({chord:diat(tonic, d).ms, at:k * .8})), opts, right: opts.indexOf(right),
      wrong:`Alla tre finns bland stegen i ${right}: ${ds.map(d => `${diat(tonic, d).name} = ${ROMAN[d]}`).join(', ')}.`,
      anim(){ const S0 = stepScale(tonic), lit = {}, nm = {};
        ds.forEach((d, k) => diat(tonic, d).ms.forEach(m => { lit[m] = [].concat(lit[m] || [], {cls:'ok', at:T0 + k * .9}); }));

// Ett grepp i omvändning k: ton k i basen och resten staplade ovanför, nära varandra. bass är bastonens midi.
function invert(root, q, k, bass){

}
const sorted = ms => [...ms].sort((a, b) => a - b);

}

  const names = merge(Object.fromEntries(c.map((m, i) => [m, {text: cn[i], at: t}])), Object.fromEntries(x.map((m, i) => [m, {text: xn[i], at: t + .9}])));

    <div class="qtop"><p class="prompt">${Q.prompt}</p>${canReplay ? `<button class="replay" id="replay" type="button">${PLAY_ICON}Spela igen</button>` : ''}</div>`;
  let kb;
  if (A) kb = A.kb;
  else if (Q.kind === 'keys') kb = done ? {...Q.show, lit: merge(Q.show.lit || {}, Object.fromEntries(S.sel.map(m => [m, 'ok'])))}
    : {...Q.show, tap: true, sel: S.sel, cheat: showCheat() ? Q.answer : []};
  // Flerval har en klaviatur att pröva på: tangenterna klingar och markeras, men de är inte svaret
  else kb = done ? (Q.show || {}) : {...(Q.show || {}), tap: true, sel: S.sel};
  if (kb) h += `<div class="kb">${kbd(kb)}</div>`;
  if (Q.kind === 'mc' && !done) h += `<p class="tryline">Pröva gärna på tangenterna. Svaret väljer du nedanför.</p>`;
  if (A && A.note) h += `<div class="animnote">${A.note}</div>`;
  if (Q.kind === 'mc') {
    const mk = i => !done ? '' : (i === Q.right ? ' ok' : S.pickC === i ? ' bad' : '') + (S.pickC === i ? ' chosen' : '');
    h += `<div class="opts">${Q.opts.map((o, i) => `<button class="opt${Q.txt ? ' txt' : ''}${mk(i)}${cheat(i === Q.right)}" data-c="${i}"${done ? ' aria-disabled="true"' : ''}>${o}</button>`).join('')}</div>`;
  }
  if (Q.kind === 'keys' && Q.need > 1 && !done)
    h += `<div class="submitrow"><button class="primary" id="submit"${S.sel.length === Q.need ? '' : ' disabled'}>Svara</button><span class="count">${S.sel.length} av ${Q.need} tangenter</span></div>`;
  if (Q.kind === 'keys' && showCheat() && !done) h += `<p class="cheatline">Svar: ${pcSet(Q.answer).map(p => pcName(p)).join(', ')}</p>`;
  if (why) {
    const wait = Math.max(0, ((S.lockUntil || 0) - (S.revealAt || 0)) / 1000);
    h += `<p class="${A ? 'sr' : 'lesson'}" role="status">${Q.wrong}</p><button type="button" class="tapcue" id="cont" aria-label="Fortsätt" style="--wait:${wait.toFixed(2)}s">${HAND}</button>`;
  }
  q.className = 'card kind-' + Q.kind;
  q.innerHTML = h;

}
// Ett tryck på en tangent: den klingar. Med en tangent att välja är det svaret, annars växlar den mellan vald och inte vald.
function tapKey(m){
  const Q = S.Q;
  if (!Q || S.answered || S.busy) return;
  piano.chord([m]);
  if (Q.kind === 'mc') { S.sel = S.sel.includes(m) ? S.sel.filter(x => x !== m) : [...S.sel, m]; render(); document.querySelector(`#q [data-key="${m}"]`)?.focus({preventScroll: true}); return; }
  if (Q.need === 1) { S.sel = [m]; S.pick = [m]; finish(Q.check([m])); return; }
  if (S.sel.includes(m)) S.sel = S.sel.filter(x => x !== m);
  else if (S.sel.length < Q.need) S.sel = [...S.sel, m];
  render();
  document.querySelector(`#q [data-key="${m}"]`)?.focus({preventScroll: true});
}
function submitKeys(){
  const Q = S.Q;
  if (!Q || S.answered || S.sel.length !== Q.need) return;
  S.pick = S.sel.slice();
  finish(Q.check(S.pick));
}
function answerMC(i){
  if (S.answered || S.busy) return;
  S.pickC = i; S.pick = i;
  finish(i === S.Q.right);
}

// Svaret: en gnista, sedan utfallet. Rätt går vidare av sig själv. Fel visar förklaringen tills man trycker.
const SPARK_MS = 900, NEXT_MS = 1700, PARTY_MS = 2600, GOLD_MS = 4200;
const stopTimer = () => { clearTimeout(S.timer); S.timer = null; S.autoNext = false; };
function finish(ok){
  S.answered = true; S.ok = ok;
  S.unlockedNow = null; S.goldNow = null; S.moved = null; S.barPlan = null;
  S.anim = !ok && S.Q.anim ? S.Q.anim(Array.isArray(S.pick) ? S.pick : [S.pick]) : null;
  if (isMix(S.topic)) {
    const t = S.topic, from = S.mix.streak;
    S.mix.streak = ok ? from + 1 : 0;
    const record = S.mix.streak > (S.mix.best[t] || 0);
    if (record) { S.mix.best[t] = S.mix.streak; save('best', JSON.stringify(S.mix.best)); }
    S.barPlan = {mix: true, ok, topic: t, from: {streak: from}, to: {streak: S.mix.streak, best: S.mix.best[t] || 0}, record};
  } else {
    const t = S.topic, before = S.done[t], from = {g: S.grade[t], up: S.up, down: S.down, done: before};
    const r = ladder(from, ok);
    if (S.pin && S.pin.topic === t) { r.g = S.pin.grade; r.done = before; r.moved = null; }
    S.grade[t] = r.g; S.up = r.up; S.down = r.down; S.done[t] = r.done;
    S.moved = r.moved || (r.done === 5 && before < 5 ? 'top' : null);
    S.barPlan = {ok, topic: t, from, to: {g: r.g, up: r.up, down: r.down, done: r.done}, moved: S.moved};
    saveProgress();
    const nx = TOPICS[TOPICS.indexOf(t) + 1];
    if (nx && before < UNLOCK_AT && r.done >= UNLOCK_AT) { S.unlockedNow = nx; grantKey(nx); }
    if (S.moved === 'top') { S.goldNow = t; S.mix.streak = 0; }
  }
  if (S.instant || reduceMotion()) { reveal(); return; }
  S.busy = true;
  sfx.spark(); sparkFX();
  S.timer = setTimeout(reveal, SPARK_MS);
}
function reveal(){
  stopTimer();
  S.busy = false; S.revealAt = Date.now();
  const A = S.anim;
  // Vid fel måste man se hela förklaringen och stapeln innan man kan gå vidare
  const barStart = S.ok ? .1 : A && !reduceMotion() ? A.total : .3;
  const barDur = !S.barPlan || S.ok ? 0 : S.barPlan.moved === 'down' ? BAR_DOWN : BAR_WRONG;
  S.lockUntil = S.revealAt + (S.instant ? 0 : S.ok ? 600 : (barStart + barDur) * 1000);
  render();
  const party = S.moved === 'up' || S.moved === 'top';
  if (!S.ok) { sfx.wrong(); if (A) piano.plan(A.sound); }
  else if (party) { sfx.right(2); const fan = S.moved === 'top' ? sfx.gold : sfx.fanfare; if (S.instant) fan(); else setTimeout(fan, 450); }
  else sfx.right(S.barPlan && !S.barPlan.mix ? S.barPlan.from.up : 0);
  if (!S.instant) outcomeFX(S.ok ? 'won' : 'lost', party);
  if (!S.instant) barFX(S.barPlan, barStart);
  if (!S.instant && S.ok) { S.autoNext = true; S.timer = setTimeout(advance, S.moved === 'top' ? GOLD_MS : party ? PARTY_MS : NEXT_MS); }
  document.getElementById('cont')?.focus({preventScroll: true});
}
// Gnistan löper längs klaviaturen, eller längs knappen man tryckte på
function fxTarget(){
  const q = document.getElementById('q'), qr = q.getBoundingClientRect();
  const el = q.querySelector('.kb svg') || (S.lastTap && q.contains(S.lastTap) ? S.lastTap : null);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return {q, x0: r.left - qr.left + 8, x1: r.right - qr.left - 8, y: r.top - qr.top + 8};
}
function fxLayer(t, cls){
  const d = document.createElement('div');
  d.className = 'fx ' + cls;
  d.style.cssText = `left:${t.x0}px;top:${t.y}px;--dx:${t.x1 - t.x0}px`;
  d.setAttribute('aria-hidden', 'true');
  t.q.appendChild(d);
  return d;
}
function sparkFX(){ S.lastTap?.classList?.add('pending'); const t = fxTarget(); if (t) fxLayer(t, 'spark').innerHTML = '<i></i>'; }
function outcomeFX(kind, party){
  const t = fxTarget();
  if (!t) return;
  const at = {...t, x0: t.x1}, d = fxLayer(at, 'out ' + kind + (party ? ' party' : ''));
  const qr = t.q.getBoundingClientRect();
  S.ledAt = {x: qr.left + at.x0, y: qr.top + at.y};
  const n = party ? 14 : 8;
  d.innerHTML = `<i></i>${kind === 'won' ? Array.from({length: n}, (_, i) => `<b style="--a:${i * (360 / n)}deg"></b>`).join('') : '<s></s><s></s><s></s>'}`;
}

// ===================== Stapeln (som Färgkoden) =====================
const BAR_WRONG = 1.1, BAR_DOWN = 1.9;
const barT = [];
const later = (sec, fn) => barT.push(setTimeout(fn, sec * 1000));
const gbarEl = document.getElementById('gbar');
const noPick = b => {
  b.classList.remove('pick'); b.querySelector('.gask')?.remove();
  b.querySelectorAll('[data-gpick]').forEach(x => { x.removeAttribute('data-gpick'); x.removeAttribute('role'); x.removeAttribute('tabindex'); x.removeAttribute('aria-label'); });
};
function clearBar(){
  barT.forEach(clearTimeout); barT.length = 0;
  gbarEl.className = 'gbar';
  document.getElementById('gbargap')?.remove();
  noPick(gbarEl);
  document.querySelectorAll('.dust').forEach(d => d.remove());
}
function floatBar(b){
  if (b.getBoundingClientRect().top >= 0 || document.getElementById('gbargap')) return;
  const gap = document.createElement('div');
  gap.id = 'gbargap'; gap.style.height = b.offsetHeight + 'px';
  b.before(gap); b.classList.add('float');
}
function sinkBar(b){
  if (!b.classList.contains('float')) return;
  const done = () => { b.classList.remove('float', 'leave'); document.getElementById('gbargap')?.remove(); };
  if (reduceMotion()) { done(); return; }
  b.classList.add('leave'); later(.25, done);
}
function barDraw(st, topic, label){
  const red = (g, i) => g === st.g - 1 && i >= 3 - (st.down || 0);
  const segs = GRADE_NAME.map((n, g) => {
    const cur = g === st.g, fill = i => g < st.g ? (red(g, i) ? 'full bad' : 'full') : cur ? (i < st.up ? 'on' : '') : g < (st.done || 0) ? 'was' : '';
    return `<div class="gseg${cur ? ' cur' : ''}"><div class="cells">${[0, 1, 2].map(i => `<i class="${fill(i)}" style="--k:${g * 3 + i}"></i>`).join('')}</div><span>${cur && label ? label : n}</span></div>`;
  }).join('');
  gbarEl.innerHTML = `<div class="gname">${topicName(topic)}</div><div class="segs">${segs}</div>`;
}
function dust(from, to, n, cls){
  if (!from) return;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i');
    d.className = 'dust ' + cls; d.style.left = from.x + 'px'; d.style.top = from.y + 'px';
    document.body.appendChild(d);
    const jx = Math.random() * 30 - 15, jy = -6 - Math.random() * 14;
    const dx = to ? to.x - from.x : jx * 1.5, dy = to ? to.y - from.y : 45 + Math.random() * 35, ms = to ? 520 : 750;
    if (d.animate) d.animate([{transform: `translate(${jx}px,${jy}px)`, opacity: 1}, {transform: `translate(${dx}px,${dy}px) scale(${to ? .4 : .7})`, opacity: to ? 1 : 0}],
      {duration: ms, delay: i * 35, easing: to ? 'cubic-bezier(.5,0,.9,.6)' : 'ease-in', fill: 'forwards'});
    later((ms + i * 35) / 1000 + .05, () => d.remove());
  }
}
function barDrawMix(topic, n, best, rec){
  gbarEl.innerHTML = `<div class="gname">${topicName(topic)} · Blandat</div><div class="mixrow"><span class="streak"><b>${n}</b> i rad</span><span class="rec${rec ? ' new' : ''}">${rec ? 'Nytt rekord!' : `Rekord ${best}`}</span></div>`;
}
function barIdle(){
  const lv = S.open;
  clearBar();
  if (!lv) return;
  if (isMix(lv)) { barDrawMix(lv, S.mix.streak, S.mix.best[lv] || 0, false); gbarEl.className = 'gbar goldbar'; return; }
  barDraw({g: S.grade[lv], up: S.up, down: S.down, done: S.done[lv]}, lv);
  if (S.answered || S.pin || lv !== S.topic) return;
  gbarEl.classList.add('pick');
  const top = Math.min(S.done[lv], MAX);
  gbarEl.querySelectorAll('.gseg').forEach((el, g) => {
    if (g > top || g === S.grade[lv]) return;
    el.dataset.gpick = g; el.setAttribute('role', 'button'); el.tabIndex = 0;
    el.setAttribute('aria-label', `${g < S.grade[lv] ? 'Gå ner' : 'Gå upp'} till ${GRADE_NAME[g]}`);
  });
}
function mixFX(P, startAt){
  const b = gbarEl, calm = reduceMotion();
  const num = () => { const e = b.querySelector('.streak b'); if (!e) return null; const r = e.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
  later(startAt, () => { barDrawMix(P.topic, P.from.streak, P.to.best - (P.record ? 1 : 0), false); b.className = 'gbar show goldbar'; floatBar(b); });
  if (P.ok) {
    later(startAt + .35, () => { if (!calm) dust(S.ledAt, num(), 10, 'in gold'); });
    later(startAt + .85, () => { barDrawMix(P.topic, P.to.streak, P.to.best, P.record); b.querySelector('.streak b').classList.add('pop'); if (P.record) b.classList.add('quake'); });
    later(startAt + 1.55, () => { b.classList.remove('show'); sinkBar(b); });
  } else {
    later(startAt + .25, () => { if (!calm && P.from.streak) dust(num(), null, 10, 'out gold'); barDrawMix(P.topic, 0, P.to.best, false); b.classList.add('shake'); });
    later(startAt + 1.2, () => sinkBar(b));
  }
}
function goldFX(b, at){
  later(at, () => {
    b.classList.remove('quake'); b.classList.add('gilded');
    if (reduceMotion()) return;
    const r = b.getBoundingClientRect(), cy = r.top + r.height / 2;
    for (let i = 0; i < 3; i++) later(.15 + i * .35, () => {
      const p = {x: r.left + r.width * (.2 + .3 * i), y: cy};
      for (let j = 0; j < 12; j++) { const a = j / 12 * Math.PI * 2, d = 60 + Math.random() * 50; dust(p, {x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d + 30}, 1, 'in gold'); }
    });
  });
}
function barFX(P, startAt){
  clearBar();
  if (!P) return;
  if (P.mix) { mixFX(P, startAt); return; }
  const b = gbarEl, calm = reduceMotion(), party = P.moved === 'up' || P.moved === 'top';
  const cellEl = (g, i) => b.querySelectorAll('.gseg')[g]?.querySelectorAll('.cells i')[i];
  const cell = (g, i) => { const c = cellEl(g, i); if (!c) return null; const r = c.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
  later(startAt, () => { barDraw(P.from, P.topic); b.className = 'gbar show'; floatBar(b); });
  if (P.ok) {
    const slot = Math.min(P.from.up, 2), g = P.from.g;
    later(startAt + .35, () => { if (!calm) dust(S.ledAt, cell(g, slot), 10, 'in'); });
    later(startAt + .85, () => {
      barDraw({...P.from, up: P.from.up + 1, down: 0}, P.topic); cellEl(g, slot)?.classList.add('pop');
      for (let i = 3 - P.from.down; i < 3 && g > 0; i++) cellEl(g - 1, i)?.classList.add('heal');
    });
    if (party) {
      later(startAt + 1.05, () => { b.classList.add('quake'); b.querySelectorAll('.gseg.cur .cells i').forEach(c => c.classList.add('ripe')); });
      later(startAt + 1.55, () => { b.classList.remove('quake'); barDraw(P.to, P.topic, P.moved === 'top' ? 'klart ✓' : null); b.classList.add('newgrade'); });
      if (P.moved === 'top') { goldFX(b, startAt + 1.7); later(startAt + 3.9, () => { b.classList.remove('show'); sinkBar(b); }); }
      else later(startAt + 2.3, () => { b.classList.remove('show'); sinkBar(b); });
    } else later(startAt + 1.5, () => { b.classList.remove('show'); sinkBar(b); });
  } else {
    const down = P.moved === 'down';
    later(startAt + .25, () => {
      if (!calm) [0, 1, 2].filter(i => i < P.from.up).forEach(i => dust(cell(P.from.g, i), null, down ? 8 : 5, 'out'));
      const nd = Math.min(P.from.down + 1, 3);
      barDraw({...P.from, up: 0, down: P.from.g > 0 ? nd : 0}, P.topic);
      if (P.from.g > 0) cellEl(P.from.g - 1, 3 - nd)?.classList.add('newbad');
      b.classList.add(down ? 'quake' : 'shake');
    });
    if (down) later(startAt + .95, () => {
      b.classList.remove('quake');
      if (!calm) [0, 1, 2].forEach(i => dust(cell(P.to.g, i), null, 7, 'out bad'));
      barDraw(P.to, P.topic); b.classList.add('newgrade', 'fell');
    });
    later(startAt + (down ? 1.9 : 1.3), () => sinkBar(b));
  }
}
// Byte av grad i stapeln: först en fråga, sedan som om man fått många rätt eller fel i rad
function gradeAsk(g){
  const cur = S.grade[S.open];
  gbarEl.querySelector('.gask')?.remove();
  gbarEl.insertAdjacentHTML('beforeend', `<div class="gask" role="group"><span>${g < cur ? `Gå ner till ${GRADE_NAME[g]}?` : `Gå upp till ${GRADE_NAME[g]} igen?`}</span>
    <button data-gyes="${g}">Ja</button><button data-gno>Nej</button></div>`);

function gradeJump(lv, to){
  const from = S.grade[lv], done = S.done[lv], down = to < from;
  S.grade[lv] = to; S.up = 0; S.down = 0;
  saveProgress();
  down ? sfx.wrong() : sfx.fanfare();
  clearBar();
  if (S.instant || reduceMotion()) { next(); return; }
  const steps = Math.abs(to - from);
  barDraw({g: from, up: 0, down: 0, done}, lv);
  later(.3, () => { barDraw({g: to, up: 0, down: 0, done}, lv); gbarEl.classList.add('newgrade', down ? 'shake' : 'quake'); });

}

  S.keys = ['tangent']; S.seen = []; S.flying = []; S.arriving = []; saveKeys();
  renderGrid();
});
// Sidan öppnar på startsidan. Förhandsvisningen från dev.html går direkt till spelkortet.
renderGrid();
if (S.pin) openTopic(S.pin.topic);
