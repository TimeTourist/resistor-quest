<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelhyllan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Två spelkort sida vid sida, staplade på smal skärm. Varje kort bär sitt spels egen värld. */
:root{
  --bg:#e9ecee;--surface:#fff;--ink:#1e262c;--muted:#5a6872;--line:#c9d1d7;
  --ivory:#f7f2e6;--ebony:#1c1a22;--keyline:#b9ad94;--chord:#d4892b;
  --blue:#1f6fb2;--blueprint:#e3f0fc;--body:#dcc596;--lead:#98a1a8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181c;--surface:#1c2329;--ink:#e6ecf0;--muted:#95a3ad;--line:#33414b;
    --ivory:#ece5d3;--ebony:#0d0c11;--keyline:#8f846c;--chord:#e9a24a;--blueprint:#173450;--lead:#7d878e;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13181c;--surface:#1c2329;--ink:#e6ecf0;--muted:#95a3ad;--line:#33414b;
  --ivory:#ece5d3;--ebony:#0d0c11;--keyline:#8f846c;--chord:#e9a24a;--blueprint:#173450;--lead:#7d878e;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--text)}
main{max-width:960px;margin:0 auto;padding:32px 16px 48px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 24px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.games{grid-template-columns:minmax(0,1fr)}}
.game{display:flex;flex-direction:column;gap:10px;min-width:0;padding:18px;border-radius:18px;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);transition:transform .2s,box-shadow .2s}
.game:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.16)}
.game:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.game svg{display:block;width:100%;height:auto;border-radius:10px}
.game h2{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:4px 0 0}
.game p{margin:0;color:var(--muted)}
.game .go{margin-top:auto;font-weight:600;color:var(--ink)}
.music{border-color:var(--ebony)}
.music .go{color:var(--chord)}
.ohm{border-color:var(--blue)}
.ohm .go{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.game{transition:none}.game:hover{transform:none}}
</style>
</head>
<body>
<main>
  <h1>Välj spel</h1>
  <p class="lead">Två spel som lär ut genom att du gör. Dina framsteg sparas i varje spel för sig.</p>
  <div class="games">
    <a class="game music" href="ackord.html">
      <svg viewBox="0 0 280 110" aria-hidden="true">
        <rect width="280" height="110" fill="var(--ebony)"/>
        <g id="kb"></g>
      </svg>
      <h2>Ackordkartan</h2>
      <p>Pianoackord, steg och lånade ackord. Förstå vad du spelar och hitta vägen vidare.</p>
      <span class="go">Spela →</span>
    </a>
    <a class="game ohm" href="fargkoden.html">
      <svg viewBox="0 0 280 110" aria-hidden="true">
        <rect width="280" height="110" fill="var(--blueprint)"/>
        <path d="M14 55H266" stroke="var(--lead)" stroke-width="6" stroke-linecap="round"/>
        <path d="M70 55C70 22 108 22 112 32H168C172 22 210 22 210 55C210 88 172 88 168 78H112C108 88 70 88 70 55Z" fill="var(--body)"/>
        <rect x="92" y="28" width="11" height="54" fill="#7a4a21"/><rect x="117" y="32" width="11" height="46" fill="#1b1b1b"/>
        <rect x="138" y="32" width="11" height="46" fill="#c62828"/><rect x="178" y="28" width="15" height="54" fill="#c9a43a"/>
      </svg>
      <h2>Färgkoden</h2>
      <p>Lär dig läsa motstånd: färgband, ohm, tolerans och E-serier.</p>
      <span class="go">Spela →</span>
    </a>
  </div>
</main>
<script>
// Klaviaturen på Ackordkartans kort: en oktav, C-dur-ackordet tänt
{
  const W = 20, white = 14, x0 = (280 - white * W) / 2, lit = [0, 2, 4];
  let s = '';
  for (let i = 0; i < white; i++) s += `<rect x="${x0 + i * W}" y="14" width="${W - 1.5}" height="82" rx="2" fill="${lit.includes(i) ? 'var(--chord)' : 'var(--ivory)'}"/>`;
  [0, 1, 3, 4, 5, 7, 8, 10, 11, 12].forEach(i => { s += `<rect x="${x0 + (i + 1) * W - 6.5}" y="14" width="12" height="50" rx="1.5" fill="var(--ebony)"/>`; });
  document.getElementById('kb').innerHTML = s;
}
// Testläget följer med in i spelen
if (new URLSearchParams(location.search).get('test') === 'true' || document.documentElement.dataset.test === 'true')
  document.querySelectorAll('a.game').forEach(a => a.setAttribute('href', a.getAttribute('href') + '?test=true'));
</script>
</body>
</html>
